<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Literary Device Slideshow (Fullscreen)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Bungee&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Fullscreen high-contrast theme for classroom readability */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #1a1a1a;
            color: #FFFFFF;
        }

        /* Muted scanlines for texture without distraction */
        body::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.2),
                rgba(0, 0, 0, 0.2) 1px,
                transparent 1px,
                transparent 4px
            );
            pointer-events: none;
            z-index: 1000;
        }

        .slideshow-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            background-color: #232323;
            box-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 40px #ff00ff;
            padding: 5vh 5vw;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .slide {
            display: none;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            text-align: center;
            position: relative;
        }

        .slide.active {
            display: flex;
        }
        
        .title-slide .slide-content h1 {
            font-family: 'Bungee', cursive;
            font-size: 6vw;
            color: #ff00ff;
            text-shadow: 6px 6px 0 #00ffff;
            margin-bottom: 2rem;
            line-height: 1.2;
        }

        .title-slide .slide-content p {
            font-family: 'Press Start 2P', cursive;
            font-size: 2vw;
            color: #ffff00;
            line-height: 1.5;
        }
        
        .slide-content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; /* Aligned to top */
            align-items: center;
            padding-top: 5vh; /* Added top padding */
            padding-bottom: 18vh; /* Safe space for buttons */
            box-sizing: border-box;
        }

        .quote-text, .device-explanation {
            /* Initial font sizes are set here */
            --base-font-size: 2.5; /* vw unit */
        }

        .quote-text {
            font-size: calc(var(--base-font-size) * 1vw);
            font-weight: 700;
            line-height: 1.4; /* Reduced line spacing */
            color: #FFFFFF;
            background-color: rgba(35,35,35,0.85);
            padding: 2rem;
            border-radius: 15px;
            border: 4px solid #00ffff;
            margin-bottom: 1.5rem;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
            max-width: 85vw; /* Made wider */
        }

        .quote-source {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.5vw;
            color: #ffff00;
            margin-bottom: 2rem;
        }

        .device-card {
            background-color: rgba(51,51,51,0.9);
            border: 4px solid #ff00ff;
            border-radius: 15px;
            padding: 2rem;
            width: 100%;
            max-width: 75vw; /* Made wider */
        }

        .device-title {
            font-family: 'Bungee', cursive;
            font-size: 3vw;
            color: #00ffff;
            margin-bottom: 1.5rem;
            text-shadow: 3px 3px 0 #ff00ff;
        }

        .device-explanation {
            font-size: calc(var(--base-font-size) * 0.72vw); /* Smaller base for explanation */
            line-height: 1.5; /* Reduced line spacing */
            color: #EAEAEA;
        }

        .nav-controls {
            position: absolute;
            bottom: 4vh;
            right: 4vw;
            display: flex;
            gap: 1.5rem;
            z-index: 20;
        }

        .nav-button {
            padding: 1rem 2rem;
            background-color: #ff00ff;
            color: #fff;
            border: none;
            cursor: pointer;
            font-family: 'Bungee', cursive;
            font-size: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 0 15px #ff00ff;
            transition: all 0.2s;
        }

        .nav-button:hover {
            background-color: #ffff00;
            color: #000;
            box-shadow: 0 0 20px #ffff00;
            transform: scale(1.1);
        }
        
        #shuffle-button {
            font-size: 1.5rem;
            background-color: #00ff00;
            color: #1a1a1a;
            box-shadow: 0 0 15px #00ff00;
        }
        
        #shuffle-button:hover {
             background-color: #ffff00;
             box-shadow: 0 0 20px #ffff00;
        }
        
        .slide-counter {
            position: absolute;
            top: 20px;
            right: 30px;
            font-family: 'Press Start 2P', cursive;
            font-size: 1.2rem;
            color: #00ffff;
            z-index: 20;
        }

        /* Responsive adjustments for smaller screens */
        @media (max-width: 768px) {
            .title-slide h1 { font-size: 8vw; }
            .title-slide p { font-size: 3vw; }
            .quote-text { --base-font-size: 4; }
            .device-explanation { --base-font-size: 4; }
            .quote-source { font-size: 2.5vw; }
            .device-title { font-size: 5vw; }
            .nav-button { font-size: 2rem; padding: 0.8rem 1.5rem; }
            .nav-controls { width: auto; left: 50%; transform: translateX(-50%); }
        }

    </style>
</head>

        let masterQuoteData = [...quotesData];
        let shuffledQuoteData = [];
        let slides = [];
        let currentSlide = 0;
        
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function buildSlides() {
            slides = []; // Clear existing slides
            // Title Slide
            slides.push(`
                <div class="slide title-slide">
                    <div class="slide-content">
                        <h1>The Devices of Literature</h1>
                        <p>How to Find Them in the Wild!</p>
                    </div>
                </div>
            `);

            // Generate slides for each quote in the shuffled deck
            shuffledQuoteData.forEach(item => {
                slides.push(`
                    <div class="slide" data-animation="${item.id}">
                        <div class="slide-content">
                            <div class="quote-text">${item.quote.replace(/\n/g, '<br>')}</div>
                            <div class="quote-source">${item.source}</div>
                        </div>
                    </div>
                `);

                item.analyses.forEach(analysis => {
                    slides.push(`
                        <div class="slide">
                             <div class="slide-content">
                                <div class="quote-text">${item.quote.replace(/\n/g, '<br>')}</div>
                                <div class="quote-source">${item.source}</div>
                                <div class="device-card">
                                    <h3 class="device-title">${analysis.device}</h3>
                                    <p class="device-explanation">${analysis.explanation}</p>
                                </div>
                            </div>
                        </div>
                    `);
                });
            });
        }
        
        function fitText(slideElement) {
            const container = slideElement.querySelector('.slide-content');
            const textElements = slideElement.querySelectorAll('.quote-text, .device-explanation');
            
            textElements.forEach(el => {
                // Reset font size to base
                const baseSize = parseFloat(getComputedStyle(el).getPropertyValue('--base-font-size'));
                let currentSize = baseSize;
                el.style.fontSize = `calc(${currentSize} * 1vw)`;

                // Shrink font size until it fits within the main slide content area
                while ((el.scrollHeight > container.clientHeight || el.scrollWidth > container.clientWidth) && currentSize > 0.5) {
                    currentSize -= 0.1;
                    el.style.fontSize = `calc(${currentSize} * 1vw)`;
                }
            });
        }


        function showSlide(index) {
            const slideContainer = document.getElementById('slide-container');
            const slideCounter = document.getElementById('slide-counter');
            
            if (index >= slides.length) { currentSlide = 0; }
            if (index < 0) { currentSlide = slides.length - 1; }
            
            slideContainer.innerHTML = slides[currentSlide];
            const activeSlideElement = slideContainer.querySelector('.slide');
            if(activeSlideElement) {
                 activeSlideElement.classList.add('active');
                 // Wait a moment for the slide to render, then fit the text
                 requestAnimationFrame(() => fitText(activeSlideElement));
            }
           
            slideCounter.textContent = `${currentSlide + 1} / ${slides.length}`;
        }

        function changeSlide(n) {
            currentSlide += n;
            showSlide(currentSlide);
        }

        function shuffleAndRestart() {
            shuffledQuoteData = [...masterQuoteData]; // Reset with all quotes
            shuffleArray(shuffledQuoteData);
            buildSlides();
            currentSlide = 1; // Start after the title slide
            showSlide(currentSlide);
        }

        // Initialize
        shuffleAndRestart(); // Initial shuffle and build
        currentSlide = 0; // Show title slide first
        showSlide(currentSlide);

        // Keyboard navigation
        document.addEventListener('keydown', (event) => {
            if (event.key === 'ArrowRight') {
                changeSlide(1);
            } else if (event.key === 'ArrowLeft') {
                changeSlide(-1);
            }
        });
