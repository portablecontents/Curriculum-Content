                scoreDisplay.textContent = `Score: ${gameState.score}`; 
                streakDisplay.textContent = `Streak: ${gameState.streak}`; 
                questionCounter.textContent = `Q: ${gameState.currentQuestionIndex + 1}/${allQuestions.length}`; 
                
                // Move the progress bar
                document.getElementById('progress-bar').style.width = `${((gameState.currentQuestionIndex + 1) / allQuestions.length) * 100}%`;
                
                // Highlight the streak
                if (gameState.streak >= 3) {
                    streakDisplay.classList.add('streak-hot');
                } else {
                    streakDisplay.classList.remove('streak-hot');
                }
            };

            const displayQuestion = () => {
                if (gameState.currentQuestionIndex >= gameState.questionBank.length) { 
                    endGame(true); 
                    return; 
                }
                const currentQuestion = gameState.questionBank[gameState.currentQuestionIndex];
                questionText.innerHTML = `<span class='text-yellow-300'>"${currentQuestion.quote}"</span><br><br>${currentQuestion.question}`;
                answersContainer.innerHTML = '';
                const shuffledAnswers = [...currentQuestion.answers]; shuffleArray(shuffledAnswers);
                shuffledAnswers.forEach(answer => { const button = document.createElement('button'); button.textContent = answer; button.classList.add('btn', 'text-xs', 'p-3', 'w-full', 'h-full'); button.addEventListener('click', () => checkAnswer(answer, currentQuestion)); answersContainer.appendChild(button); });
                updateUI();
                questionStartTime = Date.now(); // Start speed timer
            };
            
            const triggerFanfare = () => {
                fanfareContainer.innerHTML = '';
                for (let i = 0; i < 20; i++) { const sparkle = document.createElement('div'); sparkle.className = 'sparkle'; const x = Math.random() * 100; const y = Math.random() * 100; sparkle.style.left = `${x}%`; sparkle.style.top = `${y}%`; const tx = (Math.random() - 0.5) * 200; const ty = (Math.random() - 0.5) * 200; sparkle.style.setProperty('--tx', `${tx}px`); sparkle.style.setProperty('--ty', `${ty}px`); fanfareContainer.appendChild(sparkle); }
                setTimeout(() => fanfareContainer.innerHTML = '', 1000);
            };

            const resetFeedbackModal = () => {
                aiPrompt.classList.remove('hidden');
                aiResponseArea.classList.add('hidden');
                explanationContainer.classList.add('hidden');
                exampleContainer.classList.add('hidden');
                feedbackExplanation.classList.remove('typing');
                feedbackExample.classList.remove('typing');
                explainBtn.disabled = false;
                exampleBtn.disabled = false;
            };

            // NEW FLOATING SCORE SPAWNER
            const showFloatingScore = (points, buttonElement) => {
                const floater = document.createElement('div');
                floater.textContent = `+${points}`;
                floater.className = 'floating-score';
                
                const rect = buttonElement.getBoundingClientRect();
                floater.style.left = `${rect.left + (rect.width / 2) - 30}px`; 
                floater.style.top = `${rect.top}px`;
                
                document.body.appendChild(floater);
                setTimeout(() => floater.remove(), 800);
            };

            // UPDATED LOGIC (Speed Bonus, Shaking, Pulses)
            const checkAnswer = (selectedAnswer, currentQuestion) => {
                const answerButtons = answersContainer.querySelectorAll('button'); 
                answerButtons.forEach(btn => btn.disabled = true);
                
                let isCorrect = selectedAnswer === currentQuestion.correctAnswer;
                const selectedBtn = [...answerButtons].find(btn => btn.textContent === selectedAnswer);
                
                if (isCorrect) {
                    const timeTaken = (Date.now() - questionStartTime) / 1000;
                    let speedBonus = timeTaken < 10 ? 50 : 0; 
                    
                    const pointsEarned = 100 + (gameState.streak * 10) + speedBonus;
                    gameState.score += pointsEarned; 
                    gameState.streak++; 
                    
                    playFanfare(); 
                    triggerFanfare();
                    
                    if (speedBonus > 0) {
                        showFloatingScore(`${pointsEarned} (SPEED BONUS!)`, selectedBtn);
                    } else {
                        showFloatingScore(pointsEarned, selectedBtn);
                    }
                    
                    selectedBtn.classList.add('correct');
                    feedbackTitle.textContent = "Correct! ✅"; 
                    feedbackTitle.style.color = 'var(--primary-glow)';
                    
                    streakDisplay.style.animation = 'none';
                    streakDisplay.offsetHeight; 
                    streakDisplay.style.animation = null;
                } else {
                    gameState.score = Math.max(0, gameState.score - 50); 
                    gameState.streak = 0; 
                    playSound(sounds.incorrect, "C3", "4n");
                    
                    selectedBtn.classList.add('incorrect');
                    [...answerButtons].find(btn => btn.textContent === currentQuestion.correctAnswer).classList.add('correct');
                    feedbackTitle.textContent = "Incorrect! ❌"; 
                    feedbackTitle.style.color = 'var(--secondary-glow)';
                    
                    const gameContainer = document.getElementById('game-container');
                    gameContainer.classList.add('shake-animation');
                    setTimeout(() => gameContainer.classList.remove('shake-animation'), 400);
                }
                
                updateUI();
                
                setTimeout(() => { resetFeedbackModal(); feedbackModal.classList.remove('hidden'); }, isCorrect ? 1200 : 500);
            };
            
            const advanceToNextQuestion = () => { feedbackModal.classList.add('hidden'); gameState.currentQuestionIndex++; displayQuestion(); saveGame(); };

            const startGame = (isNewGame) => {
                if (!isAudioReady) initAudio(); playSound(sounds.start, "C4", "8n");
                if (isNewGame) { localStorage.removeItem('litHunterSaveData'); gameState.score = 0; gameState.streak = 0; gameState.currentQuestionIndex = 0; gameState.questionBank = [...allQuestions]; shuffleArray(gameState.questionBank); }
                gameState.playerName = playerInitialsInput.value.toUpperCase().padEnd(3, ' ') || 'AAA';
                displayQuestion(); showScreen('game'); saveGame();
            };

            const endGame = (completed = false) => {
                saveHighScore(gameState.playerName, gameState.score);
                localStorage.removeItem('litHunterSaveData');
                checkForSavedGame();
                if (completed) {
                    showScreen('gameOver');
                } else {
                    displayHighScores();
                    showScreen('highscore');
                }
            };

            const saveGame = () => localStorage.setItem('litHunterSaveData', JSON.stringify(gameState));
            const loadGame = () => { const savedData = JSON.parse(localStorage.getItem('litHunterSaveData')); if (savedData) { if (!isAudioReady) initAudio(); gameState = savedData; startGame(false); } };
            const checkForSavedGame = () => { continueGameBtn.classList.toggle('hidden', !localStorage.getItem('litHunterSaveData')); };
            
            const getHighScores = () => JSON.parse(localStorage.getItem('litHunterHighScores')) || [];
            const saveHighScore = (name, score) => { const scores = getHighScores(); scores.push({ name, score }); scores.sort((a, b) => b.score - a.score); localStorage.setItem('litHunterHighScores', JSON.stringify(scores.slice(0, 10))); };
            const displayHighScores = () => { const scores = getHighScores(); highscoreList.innerHTML = scores.length === 0 ? '<li>NO SCORES YET</li>' : scores.map((s, i) => `<li><span class="text-yellow-300">${i + 1}. ${s.name}</span> --- <span class="text-cyan-300">${s.score}</span></li>`).join(''); };

            const triggerAnimation = (element) => {
                element.classList.remove('typing'); void element.offsetWidth; element.classList.add('typing');
                element.addEventListener('animationend', () => { element.style.whiteSpace = 'normal'; }, { once: true });
            };

            // Keyboard Controls
            document.addEventListener('keydown', (e) => {
                if (!screens.game.classList.contains('hidden') && feedbackModal.classList.contains('hidden')) {
                    const answerButtons = answersContainer.querySelectorAll('button');
                    if (answerButtons.length === 0 || answerButtons[0].disabled) return;
                    
                    const keyMap = { '1': 0, '2': 1, '3': 2, '4': 3 };
                    const index = keyMap[e.key];
                    
                    if (index !== undefined && answerButtons[index]) {
                        answerButtons[index].classList.add('hover:scale-105'); 
                        answerButtons[index].click();
                    }
                }
                
                if (!feedbackModal.classList.contains('hidden') && e.key === 'Enter') {
                    proceedBtn.click();
                }
            });

            // Event Listeners
            startGameBtn.addEventListener('click', () => startGame(true));
            continueGameBtn.addEventListener('click', loadGame);
            viewScoresBtn.addEventListener('click', () => { if (!isAudioReady) initAudio(); displayHighScores(); showScreen('highscore'); });
            mainMenuBtnScores.addEventListener('click', () => { checkForSavedGame(); showScreen('start'); });
            pauseGameBtn.addEventListener('click', () => { saveGame(); checkForSavedGame(); showScreen('start'); });
            endGameBtn.addEventListener('click', () => endGame(false));
            proceedBtn.addEventListener('click', advanceToNextQuestion);
            skipBtn.addEventListener('click', () => {
                gameState.score = Math.max(0, gameState.score - 10);
                gameState.streak = 0;
                updateUI();
                advanceToNextQuestion();
            });
            viewFinalScoresBtn.addEventListener('click', () => {
                displayHighScores();
                showScreen('highscore');
            });
            
            explainBtn.addEventListener('click', () => {
                playSound(sounds.ai, 'G4', '16n');
                const currentQuestion = gameState.questionBank[gameState.currentQuestionIndex];
                feedbackExplanation.style.whiteSpace = 'nowrap';
                feedbackExplanation.textContent = currentQuestion.explanation;
                triggerAnimation(feedbackExplanation);
                aiResponseArea.classList.remove('hidden');
                explanationContainer.classList.remove('hidden');
                explainBtn.disabled = true;
            });
            
            exampleBtn.addEventListener('click', () => {
                playSound(sounds.ai, 'A4', '16n');
                const currentQuestion = gameState.questionBank[gameState.currentQuestionIndex];
                feedbackExample.style.whiteSpace = 'nowrap';
                feedbackExample.innerHTML = currentQuestion.additionalExample;
                triggerAnimation(feedbackExample);
                aiResponseArea.classList.remove('hidden');
                exampleContainer.classList.remove('hidden');
                exampleBtn.disabled = true;
            });

            // Initial state
            checkForSavedGame(); showScreen('start');
        });
    </script>
</body>
</html>
