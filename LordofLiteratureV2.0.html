<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lit-Hunter: Device Challenge</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Roboto+Mono:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>

    <style>
        :root {
            --bg-color-dark: #1a123a;
            --bg-color-light: #2c1a4d;
            --primary-glow: #00ffff;
            --secondary-glow: #ff00ff;
            --text-color: #f0f0f0;
            --text-highlight: #ffff00;
        }

        body {
            background-color: #000;
            font-family: 'Roboto Mono', monospace;
            color: var(--text-color);
        }

        #game-container {
            max-width: 900px;
            margin: 2rem auto;
            background-image: linear-gradient(160deg, var(--bg-color-light), var(--bg-color-dark));
            border: 2px solid var(--primary-glow);
            border-radius: 1rem;
            box-shadow: 0 0 25px var(--primary-glow);
            aspect-ratio: 16 / 9;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        #game-container::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(to right, rgba(0, 255, 255, 0.15) 1px, transparent 1px), linear-gradient(to bottom, rgba(0, 255, 255, 0.15) 1px, transparent 1px);
            background-size: 40px 40px; opacity: 0.5; z-index: 0;
        }

        h1, h2, .screen { position: relative; z-index: 1; }
        h1 { font-family: 'Bungee', cursive; color: #fff; text-shadow: 0 0 8px var(--primary-glow), 0 0 12px var(--secondary-glow); }
        h2 { font-family: 'Bungee', cursive; color: #fff; }

        .screen { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; transition: opacity 0.4s ease-in-out; }
        .hidden { display: none !important; }

        .btn {
            font-family: 'Roboto Mono', monospace; font-weight: 700; background-color: transparent; border: 2px solid var(--primary-glow); border-radius: 8px;
            color: var(--primary-glow); padding: 0.75rem 1.5rem; text-shadow: 0 0 5px var(--primary-glow); transition: all 0.2s ease-in-out; cursor: pointer;
            box-shadow: inset 0 0 8px rgba(0, 255, 255, 0.3);
        }

        .btn:hover:not(:disabled) { background-color: var(--primary-glow); color: var(--bg-color-dark); box-shadow: 0 0 15px var(--primary-glow); transform: translateY(-2px) scale(1.03); }
        .btn:disabled { cursor: not-allowed; opacity: 0.4; }

        input[type="text"] {
            font-family: 'Roboto Mono', monospace; background-color: rgba(0,0,0,0.5); border: 2px solid var(--secondary-glow); border-radius: 8px;
            color: var(--text-highlight); text-align: center; padding: 0.5rem; text-transform: uppercase; transition: box-shadow 0.2s ease;
        }
        
        input[type="text"]:focus { outline: none; box-shadow: 0 0 15px var(--secondary-glow); }
        #answers-container button { font-size: 0.8rem; }
        #answers-container button.correct { background-color: #0f0; border-color: #0f0; color: #000; }
        #answers-container button.incorrect { background-color: #f00; border-color: #f00; color: #000; }

        #feedback-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(26, 18, 58, 0.9);
            display: flex; justify-content: center; align-items: center; z-index: 100;
        }
        #feedback-content {
            background-color: var(--bg-color-dark); border: 2px solid var(--primary-glow); box-shadow: 0 0 15px var(--primary-glow); border-radius: 12px;
            padding: 1.5rem; width: 90%; max-width: 700px; max-height: 90%; overflow-y: auto; text-align: left; font-family: 'Share Tech Mono', monospace;
        }
        
        .ai-btn, #end-game-btn { border-color: var(--secondary-glow); color: var(--secondary-glow); box-shadow: inset 0 0 8px rgba(255, 0, 255, 0.3); text-shadow: 0 0 5px var(--secondary-glow); }
        .ai-btn:hover:not(:disabled), #end-game-btn:hover:not(:disabled) { background-color: var(--secondary-glow); color: var(--bg-color-dark); box-shadow: 0 0 15px var(--secondary-glow); }

        .typing {
            overflow: hidden; white-space: nowrap; border-right: .15em solid var(--primary-glow); width: 0;
            animation: typing 1.5s steps(40, end) forwards, blink-caret .75s step-end infinite;
            animation-fill-mode: forwards;
        }
        
        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink-caret { from, to { border-color: transparent } 50% { border-color: var(--primary-glow); } }

        #fanfare-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 150; overflow: hidden; }
        .sparkle { position: absolute; width: 10px; height: 10px; background-color: yellow; border-radius: 50%; animation: sparkle-anim 1s ease-out forwards; }
        @keyframes sparkle-anim { 0% { transform: scale(0); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.7; } 100% { transform: scale(0.5) translate(var(--tx), var(--ty)); opacity: 0; } }

        /* NEW ANIMATIONS */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .shake-animation { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; border-color: red !important; box-shadow: 0 0 25px red !important; }
        
        @keyframes pulse {
            0% { transform: scale(1); color: var(--text-color); }
            50% { transform: scale(1.3); color: var(--text-highlight); text-shadow: 0 0 10px var(--text-highlight); }
            100% { transform: scale(1); color: var(--text-color); }
        }
        .streak-hot { color: var(--text-highlight); font-weight: bold; text-shadow: 0 0 8px var(--text-highlight); animation: pulse 0.3s ease-in-out; }

        @keyframes float-up {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(1.5); }
        }

        .floating-score {
            position: fixed; 
            color: var(--text-highlight);
            font-family: 'Bungee', cursive;
            font-size: 2rem;
            pointer-events: none; 
            z-index: 9999;
            text-shadow: 0 0 15px var(--secondary-glow), 0 0 5px #fff;
            animation: float-up 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        #progress-container { width: 100%; height: 6px; background: rgba(0,255,255,0.1); border-radius: 3px; overflow: hidden; margin-top: 10px; }
        #progress-bar { height: 100%; width: 0%; background: var(--primary-glow); transition: width 0.4s ease-out; box-shadow: 0 0 10px var(--primary-glow); }

    </style>
</head>
<body>

    <div id="game-container">
        <div id="start-screen" class="screen space-y-8">
            <h1 class="text-4xl md:text-6xl">Lit-Hunter: Device Challenge</h1>
            <div class="space-y-4">
                <label for="player-initials" class="text-lg">Enter Your Initials</label>
                <input type="text" id="player-initials" maxlength="3" class="block mx-auto w-24 text-2xl">
            </div>
            <div class="flex flex-col md:flex-row space-y-4 md:space-y-0 md:space-x-4">
                <button id="start-game-btn" class="btn text-xl">New Game</button>
                <button id="continue-game-btn" class="btn text-xl hidden">Continue</button>
                <button id="view-scores-btn" class="btn text-xl">High Scores</button>
            </div>
        </div>

        <div id="game-screen" class="screen hidden flex flex-col justify-between w-full h-full">
            <div id="top-bar" class="flex justify-between w-full text-lg font-bold">
                <div id="score">Score: 0</div>
                <div id="streak">Streak: 0</div>
            </div>
            <div id="question-area" class="flex-grow flex flex-col justify-center items-center space-y-4 w-full">
                <p id="question-text" class="text-sm md:text-base leading-relaxed"></p>
                <div id="answers-container" class="grid grid-cols-1 md:grid-cols-2 gap-3 w-full max-w-4xl"></div>
            </div>
            <div id="bottom-bar" class="flex justify-between items-center w-full text-sm">
                <div id="question-counter" class="font-bold">Q: 1/117</div>
                <div class="flex space-x-2">
                    <button id="skip-btn" class="btn">Skip (-10)</button>
                    <button id="pause-game-btn" class="btn">Pause</button>
                    <button id="end-game-btn" class="btn">End Game</button>
                </div>
            </div>
            <div id="progress-container"><div id="progress-bar"></div></div>
        </div>
        
        <div id="highscore-screen" class="screen hidden space-y-6">
            <h1 class="text-6xl">High Scores</h1>
            <ul id="highscore-list" class="text-2xl space-y-2 text-left w-full max-w-md"></ul>
            <button id="main-menu-btn-scores" class="btn text-xl">Main Menu</button>
        </div>

        <div id="game-over-screen" class="screen hidden space-y-6 text-center">
            <h1 class="text-5xl md:text-6xl text-yellow-300">Congratulations!</h1>
            <p class="text-xl md:text-2xl">You have triumphed over LITERATURE!</p>
            <p class="text-3xl md:text-4xl text-secondary-glow font-bold" style="text-shadow: 0 0 8px var(--secondary-glow);">YOU ARE THE LORD OF LIT!</p>
            <button id="view-final-scores-btn" class="btn text-xl mt-4">View High Scores</button>
        </div>

        <div id="feedback-modal" class="hidden">
            <div id="feedback-content" class="space-y-4">
                <h2 id="feedback-title" class="text-3xl text-center"></h2>
                
                <div id="ai-prompt" class="text-center space-y-4">
                    <p class="text-lg text-secondary-glow">&lt;AI ASSISTANT ONLINE&gt;<br>QUERY: ASSISTANCE REQUIRED?</p>
                    <div class="flex justify-center space-x-3">
                        <button id="explain-btn" class="btn ai-btn">Explain Answer</button>
                        <button id="example-btn" class="btn ai-btn">Show Example</button>
                    </div>
                </div>

                <div id="ai-response-area" class="text-sm leading-relaxed space-y-3">
                    <div id="explanation-container" class="hidden">
                        <p class="font-bold text-yellow-300">&lt;RESPONSE: EXPLANATION&gt;</p>
                        <p id="feedback-explanation"></p>
                    </div>
                    <div id="example-container" class="hidden">
                         <p class="font-bold text-cyan-300">&lt;RESPONSE: ANALOGOUS EXAMPLE&gt;</p>
                        <p id="feedback-example"></p>
                    </div>
                </div>
                
                <button id="proceed-btn" class="btn text-lg block mx-auto mt-4">Proceed &gt;&gt;</button>
            </div>
        </div>

        <div id="fanfare-container"></div>
    </div>

    <script>
        const allQuestions = [
            { question: "In Shirley Jackson's short story \"The Lottery,\" how does the following quote display and use external conflict?", quote: "\"'It isn't fair, it isn't right,' Mrs. Hutchinson screamed, and then they were upon her.\"", answers: ["The quote showcases the final, desperate cry of an individual against the brutal, collective tradition of her society.", "The quote shows Mrs. Hutchinson in a conflict with her husband over who should have drawn the slip of paper.", "The quote demonstrates an internal conflict, where Mrs. Hutchinson is fighting against her own fear.", "The quote highlights a conflict between the village and the forces of nature."], correctAnswer: "The quote showcases the final, desperate cry of an individual against the brutal, collective tradition of her society.", explanation: "External conflict involves a character struggling against an outside force. Here, Mrs. Hutchinson (the individual) is in direct, physical conflict with the entire village (society), which is acting on a brutal tradition.", additionalExample: "In *The Hunger Games*, when Katniss Everdeen volunteers as tribute, she is placing herself in an external conflict against the oppressive society of the Capitol and its deadly rules." },
            { question: "In \"The Lottery\" by Shirley Jackson, how does the following quote use indirect characterization?", quote: "\"Although the villagers had forgotten the ritual and lost the original black box, they still remembered to use stones.\"", answers: ["The quote shows through the villagers' actions that they are blindly adherent to violence, valuing the brutal core of the tradition over its meaning.", "The quote shows that the villagers are peaceful and would rather forget the violent parts of the lottery.", "The quote characterizes the villagers as resourceful and innovative, finding new ways to carry out old traditions.", "The quote shows that the villagers are sentimental and care deeply about preserving every aspect of their history."], correctAnswer: "The quote shows through the villagers' actions that they are blindly adherent to violence, valuing the brutal core of the tradition over its meaning.", explanation: "Indirect characterization reveals personality through actions and speech, not direct statements. The villagers' action of remembering the violent part (stones) while forgetting the symbolic parts (the ritual, the box) shows us they are savage and unthinking, without the narrator ever saying so directly.", additionalExample: "In *Of Mice and Men*, Lennie petting a dead mouse shows his gentle nature but also his dangerous lack of awareness, characterizing him indirectly through his actions." },
            { question: "In \"The Monkey's Paw\" by W.W. Jacobs, what does the following quote indirectly reveal about Mrs. White's character?", quote: "\"'Go and get it and wish,' she cried, and her voice was sharp with pain. 'Oh, my boy, my boy!'\"", answers: ["Her desperate speech shows she is a mother overwhelmed by grief, driven by emotion rather than caution.", "Her command to \"go and get it\" reveals that she is a greedy and materialistic person.", "Her sharp tone shows that she is angry with her husband for making the first wish.", "Her crying reveals that she is too weak to handle the situation and wants others to solve it for her."], correctAnswer: "Her desperate speech shows she is a mother overwhelmed by grief, driven by emotion rather than caution.", explanation: "This is a prime example of indirect characterization through speech and emotion. Her frantic commands and pained cries reveal that her grief is so powerful it has overridden her previous fear of the monkey's paw. Her actions are dictated by desperation, not logic.", additionalExample: "When King Lear banishes his honest daughter Cordelia for refusing to flatter him, his rash speech indirectly characterizes him as arrogant, insecure, and prone to poor judgment based on pride." },
            { question: "In W.W. Jacobs's \"The Monkey's Paw,\" how does the imagery in the final line contribute to the story's mood?", quote: "\"The street lamp flickering opposite shone on a quiet and deserted road.\"", answers: ["It creates a stark visual of emptiness and silence, resulting in a haunting and desolate final impression.", "It creates a peaceful and calm mood, suggesting that the family has found closure.", "It creates a romantic mood, suggesting the return of a loved one.", "It creates a suspenseful mood, hinting that the danger has not yet passed."], correctAnswer: "It creates a stark visual of emptiness and silence, resulting in a haunting and desolate final impression.", explanation: "Imagery is the use of descriptive language to appeal to the senses. The words 'flickering,' 'quiet,' and 'deserted' create a powerful visual image of emptiness. This reinforces the story's bleak and tragic mood, emphasizing the profound loss the family has just experienced.", additionalExample: "In Edgar Allan Poe's 'The Raven,' the line 'And the silken, sad, uncertain rustling of each purple curtain' uses auditory and visual imagery to create a mood of suspense and melancholy." },
            { question: "In Kate Chopin's \"Story of an Hour,\" what does the \"new spring life\" outside the window symbolize for Mrs. Mallard?", quote: "\"She could see in the open square before her house the tops of trees that were all aquiver with the new spring life.\"", answers: ["It is a symbol of Mrs. Mallard's own awakening and burgeoning sense of freedom and rebirth.", "It symbolizes the life she will miss now that her husband is gone.", "It symbolizes the natural world, which is indifferent to her personal tragedy.", "It is a symbol of the memories of her husband and the life they shared."], correctAnswer: "It is a symbol of Mrs. Mallard's own awakening and burgeoning sense of freedom and rebirth.", explanation: "Symbolism is when an object or idea represents something else. The 'new spring life' symbolizes the new life and freedom that Mrs. Mallard feels is now possible for her after hearing of her husband's death.", additionalExample: "The green light at the end of Daisy's dock in *The Great Gatsby* symbolizes Gatsby's unattainable dream and hope for the past." },
            { question: "In \"Story of an Hour\" by Kate Chopin, how does the phrase \"the joy that kills\" function as a metaphor from the reader's perspective?", quote: "\"When the doctors came they said she had died of heart disease-of the joy that kills.\"", answers: ["It is a tragic metaphor for the death of the newfound joy and freedom she had just discovered.", "It is a metaphor for the literal shock of seeing her husband alive, which was too much for her weak heart.", "It is a metaphor for a peaceful and happy death, which the doctors believed she had.", "It is a metaphor for the oppressive nature of her marriage, which had been slowly killing her."], correctAnswer: "It is a tragic metaphor for the death of the newfound joy and freedom she had just discovered.", explanation: "From our perspective, we know her 'joy' was her freedom. When her husband returns, that joy is instantly killed, and this shock is what kills her. The phrase is a metaphor for the sudden, fatal loss of her new reality.", additionalExample: "The phrase 'an army of fears' is a metaphor that compares a person's many fears to a large, overwhelming military force, suggesting their intensity and number." },
            { question: "In Nathaniel Hawthorne's story \"Dr. Heidegger's Experiment,\" what does the revived rose primarily act as a motif for?", quote: "\"The crushed and dried rose symbolized his past life... When the water revives it, it symbolizes the possibility of reviving youth itself.\"", answers: ["It represents the central theme of the fleeting and delicate nature of youth and beauty.", "It represents Dr. Heidegger's scientific genius and success.", "It represents the wealth and vanity of the four guests.", "It represents the eternal nature of true love."], correctAnswer: "It represents the central theme of the fleeting and delicate nature of youth and beauty.", explanation: "A motif is a recurring element with symbolic significance. The rose, in its withered and revived states, appears repeatedly to reinforce the story's central theme: that youth and beauty are temporary and cannot be truly recaptured.", additionalExample: "In Shakespeare's *Macbeth*, the recurring motif of blood on the characters' hands represents their guilt, which cannot be washed away." },
            { question: "In \"Dr. Heidegger's Experiment\" by Nathaniel Hawthorne, how does the guests' final decision function as a form of indirect characterization?", quote: "\"They resolved forthwith to make a pilgrimage to Florida, and quaff at morning, noon, and night, from the Fountain of Youth.\"", answers: ["Their resolution to find the Fountain shows they are foolish and incapable of learning from experience.", "Their decision characterizes them as adventurous and brave.", "Their desire for more water shows they are grateful to Dr. Heidegger for his help.", "Their pilgrimage plan characterizes them as deeply religious and spiritual."], correctAnswer: "Their resolution to find the Fountain shows they are foolish and incapable of learning from experience.", explanation: "Their actions reveal their character. Despite having just experienced the folly of reliving their youth and making the same mistakes, their immediate decision is to seek out more of the magic water. This action shows they have learned nothing.", additionalExample: "A character who, after losing money gambling, immediately tries to borrow more money for another game is indirectly characterized as reckless and perhaps addicted." },
            { question: "In Ernest Hemingway's \"Old Man at the Bridge,\" how does the narrator's assessment of the old man's luck serve as direct characterization?", quote: "\"That and the fact that cats know how to look after themselves was all the good luck that old man would ever have.\"", answers: ["It is a blunt assessment that directly defines the old man by his utter helplessness and seals his fate.", "It directly characterizes the narrator as a cynical and pessimistic person.", "It directly characterizes the old man as a lucky person who has survived many hardships.", "It is a direct statement about the intelligence and resilience of cats."], correctAnswer: "It is a blunt assessment that directly defines the old man by his utter helplessness and seals his fate.", explanation: "Direct characterization is when the narrator explicitly tells the reader about a character's traits. Here, the narrator directly states the old man's fortune is nonexistent, defining him as a man with no hope or luck left.", additionalExample: "The sentence 'Sherlock Holmes was the most observant man in all of England' is direct characterization, as it explicitly states his primary trait." },
            { question: "In \"Old Man at the Bridge\" by Ernest Hemingway, how does the old man's simple statement reveal his internal conflict?", quote: "\"I was only taking care of animals.\"", answers: ["It shows his conflict comes from his sense of duty to the animals he abandoned, which causes him more pain than the war itself.", "It reveals his internal struggle with feeling useless during the war.", "It shows he is conflicted about whether he should have fought in the war or stayed with his animals.", "It reveals his internal conflict over his love for cats versus his love for pigeons and goats."], correctAnswer: "It shows his conflict comes from his sense of duty to the animals he abandoned, which causes him more pain than the war itself.", explanation: "Internal conflict is a struggle within a character's mind. The old man is not worried about the bombs or the advancing army; his entire mental struggle, his paralysis, and his despair come from his feeling of guilt and responsibility toward the animals he left behind.", additionalExample: "In *Hamlet*, the prince's internal conflict is his struggle between his desire for revenge and his moral uncertainty and indecisiveness ('To be or not to be...')." },
            { question: "In Ray Bradbury's \"The Dragon,\" how does the knights' dialogue in this quote work as indirect characterization?", quote: "\"A beast of the soul, then, and we will kill it!\"", answers: ["Their words characterize them as brave and noble, yet tragically out of touch with the new reality they face.", "Their speech characterizes them as fearful and hesitant to face the dragon.", "Their dialogue shows they are greedy and only interested in the treasure the dragon guards.", "Their statement reveals they are scientists trying to understand a new phenomenon."], correctAnswer: "Their words characterize them as brave and noble, yet tragically out of touch with the new reality they face.", explanation: "Their speech reveals their mindset. They speak in epic, mythic terms ('beast of the soul'), which characterizes them as courageous heroes from an older time. However, this same language shows they are completely unprepared for the mechanical reality of the 'dragon' (a train).", additionalExample: "A character who says, 'I only buy organic, fair-trade, artisanal coffee,' is indirectly characterized as being conscious of trends, and perhaps wealthy or pretentious, through their speech." },
            { question: "In \"The Dragon\" by Ray Bradbury, how is the train whistle an example of personification?", quote: "\"The train whistle screamed... It was gone. The land was empty. The dragon was gone.\"", answers: ["The whistle is given the human action of screaming, which gives the machine a monstrous, predatory quality.", "The whistle is described as being empty, which is a human emotion.", "The whistle is compared to a dragon, which is a mythical creature, not a person.", "The land is described as being empty, personifying it with a sense of loss."], correctAnswer: "The whistle is given the human action of screaming, which gives the machine a monstrous, predatory quality.", explanation: "Personification gives human qualities or actions to inanimate objects. A whistle can make a noise, but it cannot 'scream.' Attributing this human action of terror or pain to the machine makes it seem like a living, monstrous creature.", additionalExample: "The phrase 'The wind whispered through the trees' is personification because whispering is a human action given to the non-human wind." },
            { question: "In William Golding's Lord of the Flies, what does the destruction of the conch symbolize in this moment?", quote: "\"...the conch exploded into a thousand white fragments and ceased to exist.\"", answers: ["It symbolizes the complete triumph of savagery over civilization and order on the island.", "It symbolizes the boys' anger at Piggy for being annoying.", "It symbolizes the fragility of nature and the boys' carelessness.", "It symbolizes the end of the boys' hope of ever being rescued."], correctAnswer: "It symbolizes the complete triumph of savagery over civilization and order on the island.", explanation: "The conch shell represented rules, order, and the democratic process throughout the novel. Its violent and complete destruction at the same moment as Piggy's death symbolizes the final, irreversible collapse of civilized behavior.", additionalExample: "In *Animal Farm*, the windmill symbolizes the pigs' manipulation of the other animals with false hopes of a better future and technological progress." },
            { question: "In Lord of the Flies by William Golding, how does the mask function as a symbol in this quote?", quote: "\"...the mask was a thing on its own, behind which Jack hid, liberated from shame and self-consciousness.\"", answers: ["The mask is a symbol of savagery and the loss of individual identity, freeing Jack from the rules of society.", "The mask symbolizes Jack's creativity and artistic skill.", "The mask is a symbol of unity, allowing the boys to feel like part of a cohesive tribe.", "The mask symbolizes Jack's desire to be a leader and his insecurity about his appearance."], correctAnswer: "The mask is a symbol of savagery and the loss of individual identity, freeing Jack from the rules of society.", explanation: "The mask symbolizes the boys' descent into savagery. When Jack wears it, he is 'liberated from shame,' meaning he is no longer bound by the rules of his old, civilized identity. He can act on his primal urges without guilt.", additionalExample: "The mockingbird in *To Kill a Mockingbird* symbolizes innocence. Characters like Tom Robinson and Boo Radley are 'mockingbirds' who are harmed by the evil of the world." },
            { question: "In William Golding's Lord of the Flies, how is \"the darkness of man's heart\" used as a metaphor?", quote: "\"Ralph wept for the end of innocence, the darkness of man's heart, and the fall through the air of the true, wise friend called Piggy.\"", answers: ["It is a metaphor for the inherent evil and savagery that is a part of human nature.", "It is a metaphor for the physical darkness of the jungle at night.", "It is a metaphor for the boys' ignorance and lack of education.", "It is a metaphor for the sadness and grief Ralph feels after Piggy's death."], correctAnswer: "It is a metaphor for the inherent evil and savagery that is a part of human nature.", explanation: "A metaphor compares two unlike things. 'Darkness' is used here not to describe a literal absence of light, but to represent the abstract concept of evil and corruption that Ralph has discovered exists within all people, including himself.", additionalExample: "The phrase 'The world is a stage' is a famous metaphor from Shakespeare, comparing the complexities of life to a theatrical performance." },
            { question: "In the plot of George Orwell's Animal Farm, what does the selling of Boxer represent?", quote: "\"'They are taking Boxer to the knacker's!' cried Benjamin.\"", answers: ["It is a critical turning point that represents the ultimate betrayal of the farm's ideals and the corruption of the pigs.", "It represents a necessary sacrifice for the good of the farm's economy.", "It represents the end of the external conflict with the humans.", "It is the resolution of the story, where all the animals are finally sold."], correctAnswer: "It is a critical turning point that represents the ultimate betrayal of the farm's ideals and the corruption of the pigs.", explanation: "A turning point is a moment where the story's direction changes dramatically. Boxer was the most loyal and hardworking animal. The pigs selling him for whiskey is their ultimate act of betrayal, showing they have become just as exploitative as the humans.", additionalExample: "In *Star Wars*, the turning point is when Luke Skywalker discovers Darth Vader is his father, which redefines his entire quest and internal conflict." },
            { question: "In Animal Farm by George Orwell, what does the act of a pig walking on two legs symbolize?", quote: "\"It was a pig walking on his hind legs.\"", answers: ["It symbolizes the pigs' ultimate transformation into their former human oppressors, breaking the most fundamental rule of Animalism.", "It symbolizes the intelligence and evolutionary progress of the pigs.", "It symbolizes a moment of celebration and triumph for all the animals on the farm.", "It symbolizes the pigs' desire to be more efficient workers."], correctAnswer: "It symbolizes the pigs' ultimate transformation into their former human oppressors, breaking the most fundamental rule of Animalism.", explanation: "The original commandment was 'Four legs good, two legs bad.' A pig walking on two legs is a powerful symbol that the pigs have completely abandoned the principles of the revolution and have become identical to the human masters they overthrew.", additionalExample: "In *The Great Gatsby*, Gatsby reaching for the green light symbolizes his longing for an unattainable past with Daisy." },
            { question: "In George Orwell's Animal Farm, how does the final scene conclude a recurring motif?", quote: "\"The creatures outside looked from pig to man... but already it was impossible to say which was which.\"", answers: ["It concludes the motif of pigs gradually adopting human behaviors, solidifying their total corruption.", "It concludes the motif of the animals' unity and friendship.", "It resolves the motif of the animals' struggle against the hardships of farming.", "It resolves the motif of Benjamin's cynicism by showing he was wrong about the pigs."], correctAnswer: "It concludes the motif of pigs gradually adopting human behaviors, solidifying their total corruption.", explanation: "Throughout the book, the motif of pigs adopting human habits (sleeping in beds, drinking alcohol, etc.) tracks their corruption. This final scene is the culmination of that motif, where their transformation is so complete they are physically indistinguishable from men.", additionalExample: "The motif of light and dark in *Romeo and Juliet* (e.g., Juliet is the sun) is used throughout the play to represent the love between the two characters in contrast to the hatred of the world around them." },
            { question: "In William Shakespeare's Macbeth, how does the hallucinatory dagger function as a symbol in Macbeth's soliloquy?", quote: "\"Is this a dagger which I see before me, / The handle toward my hand?\"", answers: ["It symbolizes both Macbeth's bloody ambition and his guilty conscience regarding his impending crime.", "It is a symbol of the witches' curse and their direct control over his actions.", "It symbolizes a real weapon that appears through magic to help him.", "It is a symbol of King Duncan's royal power and authority."], correctAnswer: "It symbolizes both Macbeth's bloody ambition and his guilty conscience regarding his impending crime.", explanation: "The dagger is a symbol with a dual meaning. It points the way to Duncan's room, symbolizing Macbeth's ambition to take the throne by force. However, because it is a 'dagger of the mind' and covered in blood, it also symbolizes his immense guilt and torment over the deed.", additionalExample: "The scarlet letter 'A' in Hawthorne's novel symbolizes Hester Prynne's sin of adultery, but it later comes to symbolize her ability and strength." },
            { question: "In Macbeth by William Shakespeare, how does Lady Macbeth's line about the \"perfumes of Arabia\" demonstrate hyperbole?", quote: "\"All the perfumes of Arabia will not sweeten this little hand.\"", answers: ["It is a deliberate exaggeration used to express the immeasurable and eternal nature of her guilt.", "It is a literal statement about the weakness of Arabian perfumes.", "It is a sarcastic comment meant to mock Macbeth's earlier guilt over the blood on his hands.", "It is an exaggeration used to show her frustration with the servants for not cleaning properly."], correctAnswer: "It is a deliberate exaggeration used to express the immeasurable and eternal nature of her guilt.", explanation: "Hyperbole is exaggeration for emphasis. Lady Macbeth does not literally mean that all the perfume in the world couldn't clean her hand. She is using this extreme exaggeration to express the overwhelming and permanent nature of her guilt, which she feels can never be washed away.", additionalExample: "The phrase 'I'm so hungry I could eat a horse' is a common hyperbole to express extreme hunger." },
            { question: "In William Shakespeare's Macbeth, what is the primary function of the metaphors in Macbeth's \"walking shadow\" speech?", quote: "\"Life's but a walking shadow, a poor player / That struts and frets his hour upon the stage...\"", answers: ["He compares life to an insubstantial shadow and a brief stage performance to express his despair and feeling that life is meaningless.", "He uses the metaphors to devise a plan to trick his enemies.", "He compares life to a shadow and an actor to express his desire to be a performer.", "He uses the metaphors to criticize the actors performing at his castle."], correctAnswer: "He compares life to an insubstantial shadow and a brief stage performance to express his despair and feeling that life is meaningless.", explanation: "Macbeth uses metaphors to articulate his nihilistic worldview. By comparing life to a 'walking shadow' and a 'poor player,' he is saying that life is fleeting, meaningless, and ultimately insignificant, reflecting his own despair.", additionalExample: "In his 'I Have a Dream' speech, Martin Luther King Jr. uses the metaphor of cashing a check to describe the demand for freedom and justice that was promised but not delivered." },
            { question: "In Mary Shelley's Frankenstein, how does the Creature's quote demonstrate his internal conflict?", quote: "\"Did I request thee, Maker, from my clay / To mould Me man, did I solicit thee / From darkness to promote me?\"", answers: ["He is tormented by the injustice of being created only to be abandoned and left to suffer.", "He is conflicted about whether he should seek revenge on Victor or try to find a new life.", "He is struggling to understand the scientific principles that led to his creation.", "He is in conflict with society's rules and expectations."], correctAnswer: "He is tormented by the injustice of being created only to be abandoned and left to suffer.", explanation: "The Creature's internal conflict is rooted in his very existence. He is grappling with the philosophical torment of being brought into a life of suffering he never asked for, questioning the morality of his creator and the purpose of his own miserable consciousness.", additionalExample: "A character who has to choose between betraying their friend to save their family is facing a powerful internal conflict between loyalty and love." },
            { question: "In Frankenstein by Mary Shelley, how does the Creature use the figures of Adam and \"the fallen angel\" as metaphors for his own identity?", quote: "\"I ought to be thy Adam, but I am rather the fallen angel...\"", answers: ["He uses them to describe his fall from a state of potential innocence to one of vengeful misery.", "He uses them to suggest that he has supernatural powers.", "He uses them to compare his physical strength to that of biblical figures.", "He uses them to mock Victor's belief in religion."], correctAnswer: "He uses them to describe his fall from a state of potential innocence to one of vengeful misery.", explanation: "He uses these biblical figures as metaphors for his relationship with Victor. He feels he should have been the beloved creation (Adam), but because of Victor's rejection, he has become an outcast filled with hate, like a fallen angel (Satan).", additionalExample: "A politician might be called a 'lion in debate' as a metaphor for their ferocity and strength, or a 'snake in the grass' as a metaphor for their deceptiveness." },
            { question: "In Mary Shelley's Frankenstein, how does the Creature's final speech serve as the novel's plot resolution?", quote: "\"Soon these burning miseries will be extinct. I shall ascend my funeral pile triumphantly...\"", answers: ["His declared intention to die ends the cycle of revenge and resolves the central conflict between him and his creator.", "It resolves the plot by revealing that the Creature has finally found happiness.", "It is the climax of the story, where he finally confronts Victor.", "It introduces a new plot where the Creature seeks to create a companion for himself."], correctAnswer: "His declared intention to die ends the cycle of revenge and resolves the central conflict between him and his creator.", explanation: "The resolution is the end of the story where the central conflict is resolved. The entire novel is driven by the conflict between Victor and the Creature. By declaring his own death, the Creature ends the cycle of revenge and suffering, bringing the narrative to a final close.", additionalExample: "The resolution of *The Lord of the Rings* occurs after the Ring is destroyed, when Aragorn is crowned king and the hobbits return home, resolving the central conflict of the war." },
            { question: "In \"The Cask of Amontillado\" by Edgar Allan Poe, how does Montresor's reply to Fortunato's plea serve as indirect characterization?", quote: "\"'For the love of God, Montresor!' 'Yes,' I said, 'for the love of God!'\"", answers: ["His chilling, ironic repetition of the plea characterizes him as utterly remorseless and sadistic.", "His reply characterizes him as a deeply religious man who believes his actions are divinely justified.", "His answer shows that he is having second thoughts and feels guilty for his actions.", "His speech characterizes him as confused and not fully aware of what he is doing."], correctAnswer: "His chilling, ironic repetition of the plea characterizes him as utterly remorseless and sadistic.", explanation: "Montresor's speech reveals his cruel nature. By ironically echoing Fortunato's desperate plea, he is not showing mercy but mocking his victim's terror. This action characterizes him as a cold, sadistic, and remorseless killer.", additionalExample: "When a character loses a game and says, 'I wasn't even trying,' their speech indirectly characterizes them as a sore loser who cannot admit defeat." },
            { question: "In Saki's The Interlopers, how does the following quote demonstrate a resolution to the characters' internal conflict?", quote: "\"And each prayed a private prayer that his men might be the first to arrive, so that he might be the first to show honorable attention to the enemy that had become a friend.\"", answers: ["It reveals their lifelong hatred has been completely replaced by a newfound desire for reconciliation and honor.", "It shows they are still conflicted, as each man secretly hopes his own men will capture the other.", "It highlights their internal struggle between family duty and personal feelings.", "The prayer is a sign of their internal fear of dying alone in the forest."], correctAnswer: "It reveals their lifelong hatred has been completely replaced by a newfound desire for reconciliation and honor.", explanation: "The two men have spent their lives hating each other. This moment resolves that internal hatred. Their prayer shows they have completely changed their minds and now desire to show kindness and honor to their former enemy, a total reversal of their previous feelings.", additionalExample: "In *A Christmas Carol*, Scrooge's internal conflict between greed and humanity is resolved when he joyfully decides to change his ways on Christmas morning." },
            { question: "In The Interlopers by Saki, how does this single word function as the story's shocking plot resolution?", quote: "\"Wolves.\"", answers: ["The word is an ironic resolution, making the men's reconciliation meaningless as they face a new, insurmountable external conflict.", "It is the story's climax, showing the final battle between the men and the forces of nature.", "It is a cliffhanger, leaving the reader to wonder if the men will be rescued in time.", "It resolves the plot by having the wolves rescue the men and lead them to safety."], correctAnswer: "The word is an ironic resolution, making the men's reconciliation meaningless as they face a new, insurmountable external conflict.", explanation: "The resolution is the final outcome. Just as the men resolve their conflict, the story resolves with a cruel twist of irony. The figures they see are not their rescuers, but wolves, meaning their newfound friendship is tragically pointless as they are about to die.", additionalExample: "The resolution of the movie *The Sixth Sense* is the shocking revelation that Dr. Crowe was dead the entire time, which recontextualizes the entire plot." },
            { question: "In Guy de Maupassant's The Necklace, how does this passage use indirect characterization to show Mathilde's transformation?", quote: "\"She had become the woman of impoverished households—strong and hard and rough. With frowsy hair, with skirts awry, and with red hands, she talked loud while washing the floor...\"", answers: ["Her changed looks and actions show the brutal, physical toll that a decade of poverty and hard labor has taken on her.", "It shows that she has become a more confident and outspoken person.", "It characterizes her as lazy and careless about her appearance.", "It reveals that she has secretly enjoyed the simple life of a working-class woman."], correctAnswer: "Her changed looks and actions show the brutal, physical toll that a decade of poverty and hard labor has taken on her.", explanation: "The description of her physical appearance—'frowsy hair,' 'red hands'—and her actions—'talked loud'—indirectly characterizes her. It shows the reader how much she has changed from the delicate, dreaming woman she once was into someone hardened by years of toil.", additionalExample: "A character described with 'immaculate clothes and a perfectly knotted tie' is indirectly characterized as being precise, professional, and perhaps rigid, just through their appearance." },
            { question: "In The Necklace by Guy de Maupassant, what does the fake necklace come to symbolize by the end of the story?", quote: "\"'Oh, my poor Mathilde! Why, my necklace was paste. It was worth at most five hundred francs!'\"", answers: ["It symbolizes the deceptive nature of appearances and the vanity that led to Mathilde's ruin.", "It symbolizes the true friendship between Mathilde and Madame Forestier.", "It symbolizes the wealth and high social status that Mathilde always desired.", "It symbolizes the harsh economic realities of 19th-century France."], correctAnswer: "It symbolizes the deceptive nature of appearances and the vanity that led to Mathilde's ruin.", explanation: "The necklace symbolizes the core theme of the story. It appeared to be valuable but was actually worthless. This mirrors how Mathilde's obsession with the appearance of wealth led her to a life of real poverty, a ruin based on a false premise.", additionalExample: "The conch in *Lord of the Flies* symbolizes civilization and order; when it shatters, it symbolizes the end of civilized behavior on the island." },
            { question: "In O. Henry's The Gift of the Magi, what does Della's action and dialogue indirectly characterize her as?", quote: "\"'You've cut off your hair?' asked Jim... 'Cut it off and sold it,' said Della. 'Don't you like me just as well, anyhow? I'm me without my hair, ain't I?'\"", answers: ["She is characterized as selfless and deeply in love, showing her identity is tied to Jim's love, not her appearance.", "She is characterized as impulsive and careless, not thinking about the consequences of her actions.", "She is characterized as insecure, needing Jim's constant approval.", "She is characterized as resentful that she had to sell her hair for him."], correctAnswer: "She is characterized as selfless and deeply in love, showing her identity is tied to Jim's love, not her appearance.", explanation: "Her actions (selling her most prized possession) and her words ('I'm me without my hair') show what she values most. She prioritizes her love for Jim over her own vanity, revealing her selfless and loving character.", additionalExample: "A student who stays up all night to help a friend study for a test they don't share is indirectly characterized as a loyal and selfless friend." },
            { question: "In The Gift of the Magi by O. Henry, how does the narrator use a metaphor to convey the story's theme in the final line?", quote: "\"But in a last word to the wise of these days let it be said that of all who give gifts these two were the wisest... They are the magi.\"", answers: ["The narrator compares Jim and Della to the biblical Magi to suggest their selfless, sacrificial love makes their gifts the wisest of all.", "The metaphor suggests that Jim and Della are royalty.", "The metaphor is used to imply that the gifts Jim and Della gave were expensive and rare.", "The narrator uses the metaphor to criticize the couple for their foolish and impractical gifts."], correctAnswer: "The narrator compares Jim and Della to the biblical Magi to suggest their selfless, sacrificial love makes their gifts the wisest of all.", explanation: "The narrator explicitly compares Jim and Della to the Magi. This metaphor elevates their simple, seemingly foolish gifts to the level of the wise gifts given to Jesus, suggesting that the true wisdom in gift-giving comes from sacrifice and love.", additionalExample: "The phrase 'All the world's a stage' is a metaphor comparing the world to a theater to comment on the nature of human life." },
            { question: "In Richard Connell's The Most Dangerous Game, how does this exchange of dialogue establish the story's external conflict?", quote: "\"'Hunting? General Zaroff, what you speak of is murder.'\"", answers: ["It establishes the primary conflict between Rainsford's moral code and Zaroff's depraved \"game\".", "It shows an internal conflict within Rainsford as he debates the ethics of hunting.", "It creates a conflict between General Zaroff and his servant, Ivan.", "It introduces a conflict between the hunters and the island's dangerous animals."], correctAnswer: "It establishes the primary conflict between Rainsford's moral code and Zaroff's depraved \"game\".", explanation: "This line draws a clear line in the sand. Rainsford's statement 'what you speak of is murder' directly opposes Zaroff's view of hunting humans. This clash of values establishes the central man-vs-man external conflict of the story.", additionalExample: "In *Harry Potter*, the external conflict is established early on between Harry and Voldemort, representing the forces of good versus evil." },
            { question: "In The Most Dangerous Game by Richard Connell, what does Rainsford's final thought indirectly characterize him as?", quote: "\"He had never slept in a better bed, Rainsford decided.\"", answers: ["It characterizes him as a changed man who has become as ruthless as the man he hunted.", "It shows he is relieved the hunt is over and can finally rest.", "It characterizes him as someone who appreciates luxury and comfort.", "It suggests he feels guilty and is trying to forget what he has done."], correctAnswer: "It characterizes him as a changed man who has become as ruthless as the man he hunted.", explanation: "The fact that Rainsford can sleep so soundly in his victim's bed implies that he is untroubled by the fact he has just killed a man. This thought indirectly characterizes him as having adopted Zaroff's ruthless worldview, where the hunter feels no remorse for defeating the hunted.", additionalExample: "A detective who, after a brutal case, immediately starts joking with his partner is indirectly characterized as being hardened or desensitized to violence." },
            { question: "In William Shakespeare's Romeo and Juliet, how does Romeo use a metaphor to describe Juliet?", quote: "\"But, soft! what light through yonder window breaks? / It is the east, and Juliet is the sun.\"", answers: ["He compares her to the sun, meaning she is the center of his world, bringing light that banishes his darkness.", "He compares her to the sun to say she has a fiery and angry personality.", "He uses the metaphor to suggest she is distant and unreachable.", "He compares her to the sun because her bedroom is brightly lit."], correctAnswer: "He compares her to the sun, meaning she is the center of his world, bringing light that banishes his darkness.", explanation: "Romeo makes a direct comparison between Juliet and the sun, a powerful life-giving force. This metaphor shows that he sees her as essential, radiant, and the center of his existence.", additionalExample: "The phrase 'Her voice is music to his ears' is a metaphor comparing her voice to music to express how much he enjoys hearing it." },
            { question: "In Romeo and Juliet by William Shakespeare, how does Mercutio's dying declaration address the play's central external conflict?", quote: "\"A plague o' both your houses! / They have made worms' meat of me.\"", answers: ["He directly curses the Montagues and Capulets, blaming their feud for his death and foreshadowing their destruction.", "He declares a conflict between himself and Romeo for getting him involved.", "He starts a conflict between the Prince and the two families.", "He addresses the conflict between the living and the dead."], correctAnswer: "He directly curses the Montagues and Capulets, blaming their feud for his death and foreshadowing their destruction.", explanation: "Mercutio's line directly addresses the central conflict—the feud between the two families ('both your houses'). He correctly blames their pointless rivalry for his death and curses them, which foreshadows the tragic end that will befall both families.", additionalExample: "In *To Kill a Mockingbird*, Atticus Finch's closing argument directly addresses the external conflict of racial prejudice versus justice in the courtroom and society." },
            { question: "In William Shakespeare's Romeo and Juliet, how does Juliet use personification in her final moments?", quote: "\"O happy dagger! / This is thy sheath; there rust, and let me die.\"", answers: ["She speaks to the dagger as if it were a welcome friend, expressing relief at finding a way to end her grief.", "She personifies her body as a sheath, giving it a non-human quality.", "She gives the dagger the human emotion of sadness by asking it to rust.", "She personifies death, asking it to come and take her."], correctAnswer: "She speaks to the dagger as if it were a welcome friend, expressing relief at finding a way to end her grief.", explanation: "Juliet gives the dagger the human quality of being 'happy.' She speaks to the inanimate object as if it were a conscious being that is bringing her a welcome release from her suffering. This is a clear use of personification.", additionalExample: "The phrase 'The angry storm pounded on the roof' is personification, giving the human emotion of anger to the inanimate storm." },
            { question: "In John Steinbeck's Of Mice and Men, how does Crooks's speech relate to a central motif of the novel?", quote: "\"A guy goes nuts if he ain't got nobody... I tell ya, a guy gets too lonely an' he gets sick.\"", answers: ["His words directly state the novel's central motif of loneliness and its corrosive effects.", "His speech introduces the motif of the American Dream.", "His dialogue relates to the motif of the corrupting nature of power.", "He is explaining the motif of man's relationship with nature."], correctAnswer: "His words directly state the novel's central motif of loneliness and its corrosive effects.", explanation: "Crooks's speech explicitly articulates one of the book's most important recurring ideas (motifs): the devastating impact of loneliness on the human spirit. Nearly every character in the book suffers from this isolation.", additionalExample: "The recurring motif of dreams in *Of Mice and Men* reinforces the theme of the elusive American Dream and the need for hope, even if it's unrealistic." },
            { question: "In Of Mice and Men by John Steinbeck, how does George's final action in the novel serve as indirect characterization?", quote: "\"He pulled the trigger... Lennie jarred, and then settled slowly forward to the sand, and he lay without quivering.\"", answers: ["The act, though horrific, characterizes him as merciful and courageous for sparing Lennie a more brutal fate from the lynch mob.", "The action characterizes him as a cold-blooded and selfish killer.", "It shows that he is a weak character who gave in to pressure from the other men.", "It characterizes him as impulsive and prone to fits of anger."], correctAnswer: "The act, though horrific, characterizes him as merciful and courageous for sparing Lennie a more brutal fate from the lynch mob.", explanation: "This action is a profound form of indirect characterization. Instead of being a selfish act, it is presented as an act of love. George knows the mob will torture and kill Lennie brutally. By doing it himself, quickly and while Lennie is happy, he is characterized as a deeply pained but merciful friend.", additionalExample: "A firefighter running back into a burning building to save a pet is indirectly characterized as brave and compassionate through their actions." },
            { question: "In John Steinbeck's Of Mice and Men, what does the dead puppy symbolize in this scene?", quote: "\"'Why do you got to get killed? You ain't so little as mice. I didn't bounce you hard.'\"", answers: ["It symbolizes Lennie's inability to control his own strength and serves as a grim omen for what will happen to Curley's wife.", "The puppy symbolizes the death of the American Dream for Lennie and George.", "It symbolizes the cruelty of the world and the loss of innocence.", "The puppy is a symbol of Lennie's desire for a friend."], correctAnswer: "It symbolizes Lennie's inability to control his own strength and serves as a grim omen for what will happen to Curley's wife.", explanation: "The puppy is a symbol that functions as foreshadowing. Lennie's accidental killing of the soft creature, despite his good intentions, symbolizes his dangerous, uncontrollable strength. It warns the reader that his inability to regulate his power will lead to a greater tragedy.", additionalExample: "In *Macbeth*, the stormy weather on the night of Duncan's murder symbolizes the disruption of the natural order caused by Macbeth's treasonous act." },
            { question: "In Harper Lee's To Kill a Mockingbird, what does the \"mad dog\" symbolize in the context of the novel?", quote: "\"Atticus was the deadest shot in Maycomb County in his time.\"", answers: ["The dog symbolizes the irrational prejudice and \"madness\" of racism in Maycomb, which only Atticus is willing and able to confront.", "The dog is a symbol of the wild and untamed nature of the American South.", "The dog symbolizes a real threat to the physical safety of the children.", "The dog symbolizes Atticus's hidden, violent past."], correctAnswer: "The dog symbolizes the irrational prejudice and \"madness\" of racism in Maycomb, which only Atticus is willing and able to confront.", explanation: "The dog, sick with rabies, symbolizes the disease of racism spreading through Maycomb. It is an irrational and dangerous threat. Atticus is the only one willing and able to step up and 'shoot' it down, just as he is the only one willing to take on the racist court case.", additionalExample: "The white whale in *Moby Dick* symbolizes many things, including nature's power, obsession, and the unknowable nature of God." },
            { question: "In To Kill a Mockingbird by Harper Lee, how does this quote from Atticus's speech address the novel's central external conflict?", quote: "\"'But there is one way in this country in which all men are created equal—there is one human institution that makes a pauper the equal of a Rockefeller... That institution, gentlemen, is a court.'\"", answers: ["It comes during the trial of Tom Robinson, pitting Atticus's belief in justice against the town's deep-seated racism.", "It addresses the conflict between the rich and the poor in Maycomb society.", "It highlights the conflict between Atticus and his children.", "It refers to the conflict between local laws and federal laws."], correctAnswer: "It comes during the trial of Tom Robinson, pitting Atticus's belief in justice against the town's deep-seated racism.", explanation: "The speech is the climax of the novel's main external conflict: the trial. Atticus directly confronts the town's racism by appealing to the ideal of the court as a place where all men are truly equal, pitting this ideal against the jury's prejudice.", additionalExample: "In the play *A Few Good Men*, Colonel Jessup's courtroom outburst, 'You can't handle the truth!', directly addresses the central external conflict between military authority and legal accountability." },
            { question: "In Harper Lee's To Kill a Mockingbird, how does Scout's realization on the Radley porch serve as a resolution for her character arc?", quote: "\"Atticus was right. One time he said you never really know a man until you stand in his shoes and walk around in them. Just standing on the Radley porch was enough.\"", answers: ["This moment of epiphany signifies her maturation from an innocent child into a person who understands empathy.", "It resolves the mystery of who Boo Radley is.", "It serves as the climax of the story, where Scout finally confronts her fears.", "It resolves the main conflict between the children and Boo Radley."], correctAnswer: "This moment of epiphany signifies her maturation from an innocent child into a person who understands empathy.", explanation: "A character arc is the transformation a character undergoes. Scout's arc is about learning empathy. This moment is the resolution of that arc because by standing on Boo's porch and seeing the world from his perspective, she finally understands her father's lesson about empathy.", additionalExample: "The resolution of Darth Vader's character arc is when he sacrifices himself to save his son, completing his transformation from villain back to hero." },
            { question: "In Terry Pratchett's Wyrd Sisters, how does the following quote use an extended metaphor to describe anger?", quote: "\"Genuine anger was one of the world's great creative forces... Let it drown whole valleys of the mind... and let the iron hard stream of wrath power the turbines of revenge.\"", answers: ["It compares anger to a powerful river that is dammed and channeled to power turbines, framing it as a controllable, strategic force.", "It compares anger to a destructive fire that burns everything in its path.", "It uses the metaphor of a valley to describe the peaceful parts of the mind.", "It compares revenge to a turbine to show that it is a complex and mechanical process."], correctAnswer: "It compares anger to a powerful river that is dammed and channeled to power turbines, framing it as a controllable, strategic force.", explanation: "An extended metaphor is a comparison that continues over several lines. Here, anger isn't just a river; it's a river that can be dammed, can 'drown valleys,' and can be used to 'power the turbines of revenge,' extending the comparison to create a complex image of anger as a powerful, controllable energy source.", additionalExample: "In *Romeo and Juliet*, Romeo uses an extended metaphor comparing Juliet to a holy shrine and his lips to pilgrims to describe his desire to kiss her." },
            { question: "In this quote by William S. Burroughs, how does the simile characterize people who cause trouble?", quote: "\"Most of the trouble in this world has been caused by folks who can't mind their own business, because they have no business of their own to mind, any more than a smallpox virus has.\"", answers: ["It compares them to a \"smallpox virus,\" suggesting they are a mindless, destructive force that exists only to harm others.", "It compares them to a virus to suggest that their behavior is contagious.", "It uses a simile to imply that these people are physically ill.", "It compares them to a virus to show that they are a small and insignificant part of the world."], correctAnswer: "It compares them to a \"smallpox virus,\" suggesting they are a mindless, destructive force that exists only to harm others.", explanation: "A simile compares two things using 'like' or 'as' (or in this case, 'any more than'). By comparing these people to a virus, Burroughs suggests they lack self-awareness or purpose ('no business of their own') and exist only to spread harm, much like a mindless pathogen.", additionalExample: "The line 'My love is like a red, red rose' is a famous simile by Robert Burns, comparing the beauty and freshness of his love to a flower." },
            { question: "In this quote from Mark Twain, how does the witty statement serve as indirect characterization?", quote: "\"I was born modest, but it didn't last.\"", answers: ["It characterizes the speaker's persona as humorous, self-aware, and ironically immodest through a candid admission.", "It characterizes the speaker as someone who regrets losing their modesty.", "It shows that the speaker is arrogant and boastful.", "It characterizes the speaker as unreliable and prone to changing their mind."], correctAnswer: "It characterizes the speaker's persona as humorous, self-aware, and ironically immodest through a candid admission.", explanation: "The speaker's words reveal their character. By admitting to a lack of modesty in a humorous way, the speaker characterizes themselves as witty and self-aware. The statement is itself an example of their charming lack of modesty.", additionalExample: "When Oscar Wilde wrote, 'I can resist everything except temptation,' the witty phrase indirectly characterized his persona as a clever and indulgent dandy." },
            { question: "In this quote by Albert Camus, how does the statement describe the resolution of an internal conflict?", quote: "\"No matter how hard the world pushes against me, within me, there's something stronger - something better, pushing right back.\"", answers: ["The speaker acknowledges external pressures but finds a greater, winning force within themselves, showcasing resilience.", "It shows the speaker is still in conflict with the world and is losing the battle.", "It describes an external conflict between the speaker and society.", "It resolves the conflict by showing the speaker has decided to give up."], correctAnswer: "The speaker acknowledges external pressures but finds a greater, winning force within themselves, showcasing resilience.", explanation: "The internal conflict is the struggle between the world's pressure and the speaker's will. The resolution is the speaker's realization that their internal strength is greater. They have resolved the conflict by concluding that they can and will endure.", additionalExample: "A character who has been struggling with fear might resolve their internal conflict by saying, 'I am afraid, but I will do it anyway,' showing their courage has won." },
            { question: "In the context of the figures cited by the author, what does the word \"No\" become a symbol of?", quote: "\"'No.' - Shiprah and Puah, David, Spartacus, Leonidas of Sparta, Socrates\"", answers: ["It becomes a powerful symbol of defiance, courage, and the assertion of individual will against overwhelming authority.", "It is a symbol of negativity and pessimism.", "It symbolizes the characters' refusal to cooperate with each other.", "It symbolizes a simple misunderstanding between the characters."], correctAnswer: "It becomes a powerful symbol of defiance, courage, and the assertion of individual will against overwhelming authority.", explanation: "By associating the simple word 'No' with historical figures who defied powerful orders (e.g., Socrates refusing to stop teaching, Spartacus leading a rebellion), the word itself becomes a symbol representing the much larger concepts of courage and resistance.", additionalExample: "The color white is often used as a symbol of purity or innocence, while the color black can symbolize death or evil." },
            { question: "In Terry Pratchett's Guards! Guards!, how does the following passage use direct characterization?", quote: "\"They accept evil not because they say yes, but because they don't say no.\"", answers: ["The narrator explicitly defines the flaw of a certain type of person as enabling evil through apathy and a failure to resist.", "It indirectly shows that the people are evil through their actions.", "It directly characterizes the dragon as a symbol of evil.", "It directly characterizes the speaker as a judgmental person."], correctAnswer: "The narrator explicitly defines the flaw of a certain type of person as enabling evil through apathy and a failure to resist.", explanation: "This is direct characterization because the narrator is explicitly telling us about the moral failing of these people. There is no inference needed; the text plainly states their character flaw is passivity in the face of evil.", additionalExample: "The statement, 'He was a cruel man, who took pleasure in the suffering of others,' is direct characterization because it leaves no doubt about the man's personality." },
            { question: "In Victor Hugo's Les Miserables, how is the claim about the Parisian's breath an example of hyperbole?", quote: "\"...his breath has enough wind to disarrange the folds of the Alps...\"", answers: ["It is a clear exaggeration used to emphasize the epic, revolutionary power contained within the common man.", "It is a literal description of the man's unusual lung capacity.", "It is a metaphor for the man's ability to create change.", "It is a sarcastic comment on the man's boastful nature."], correctAnswer: "It is a clear exaggeration used to emphasize the epic, revolutionary power contained within the common man.", explanation: "Hyperbole is intentional exaggeration for effect. A person's breath cannot literally move mountains. Hugo uses this impossible image to dramatically emphasize the immense, almost geological power for change that resides within the ordinary people of Paris.", additionalExample: "The sentence 'I have a million things to do today' is a hyperbole used to express that someone is very busy." },
            { question: "In this quote from James Baldwin, how does the statement serve as indirect characterization of the speaker?", quote: "\"In this world, there isn't as much humanity as one would like. But, there is enough.\"", answers: ["It characterizes the speaker as a hopeful realist who sees the world clearly without falling into cynicism.", "It characterizes the speaker as a pessimist who believes the world is a bad place.", "It shows the speaker is an idealist who believes humanity is perfect.", "It characterizes the speaker as someone who is indecisive and cannot make up their mind."], correctAnswer: "It characterizes the speaker as a hopeful realist who sees the world clearly without falling into cynicism.", explanation: "The speaker's balanced statement reveals their personality. They don't ignore the world's flaws ('isn't as much... as one would like'), but they also affirm its value ('But, there is enough'). This characterizes them as someone who is realistic but ultimately hopeful.", additionalExample: "A character who says, 'The odds are against us, but I think we have a chance,' is indirectly characterized as a cautious optimist." },
            { question: "In Mark Twain's A Connecticut Yankee in King Arthur's Court, how does this quote use the metaphor of transmission to describe how opinions are formed?", quote: "\"We have no thoughts of our own, no opinions of our own; they are transmitted to us, trained into us.\"", answers: ["It suggests that ideas are not created internally but are like signals transmitted from an external source, like society or upbringing.", "It uses a metaphor to describe the process of learning in a school.", "The metaphor of transmission refers to the genetic inheritance of traits.", "It is a metaphor for the way diseases are transmitted from person to person."], correctAnswer: "It suggests that ideas are not created internally but are like signals transmitted from an external source, like society or upbringing.", explanation: "The metaphor here is comparing the formation of opinions to a radio 'transmission.' Ideas are not something we create, but something that is sent to us and passively received, like a signal from society that is 'trained into us.'", additionalExample: "The metaphor 'an argument is war' shapes how we talk about debating, using phrases like 'defending a position,' 'attacking a weak point,' and 'winning an argument.'" },
            { question: "In Don Quixote by Miguel de Cervantes Saavedra, how does the statement \"Hunger is the best sauce in the world\" function as a metaphor?", quote: "\"Hunger is the best sauce in the world.\"", answers: ["It compares hunger to a \"sauce,\" implying that true need makes any simple food seem delicious and satisfying.", "It is a literal statement encouraging people to eat sauce when they are hungry.", "It is a metaphor for the idea that wanting something makes it more valuable.", "It compares the world to a plate of food that needs sauce."], correctAnswer: "It compares hunger to a \"sauce,\" implying that true need makes any simple food seem delicious and satisfying.", explanation: "A sauce makes food taste better. By comparing hunger to a 'sauce,' the speaker is saying that being truly hungry is the best way to make any food, no matter how plain, taste wonderful. It's a metaphor for how necessity creates appreciation.", additionalExample: "The metaphor 'Time is money' suggests that time is a valuable resource that can be spent, saved, or wasted, just like currency." },
            { question: "In Miguel de Cervantes Saavedra's Don Quixote, how does the description of Don Quixote's brain serve as indirect characterization?", quote: "\"Finally, from so little sleeping and so much reading, his brain dried up and he went completely out of his mind.\"", answers: ["It describes the effects of his obsessive actions, characterizing him as someone prone to fantasy and obsession.", "It characterizes him as a dedicated scholar who values reading above all else.", "It shows that he is physically weak and unhealthy.", "It characterizes him as someone who is easily influenced by others."], correctAnswer: "It describes the effects of his obsessive actions, characterizing him as someone prone to fantasy and obsession.", explanation: "The cause-and-effect description of his actions (reading too much) leading to a result (a dried-up brain) characterizes him as obsessive. It shows he is the kind of person who will pursue a singular passion to the point where it detaches him from reality.", additionalExample: "A description of a character's room as being meticulously organized and spotless indirectly characterizes that person as orderly and disciplined." },
            { question: "In J.R.R. Tolkien's The Return of the King, what is the function of the cock crowing in this tense scene, in terms of symbolism?", quote: "\"And in that very moment... a cock crowed... Rohan had come at last.\"", answers: ["It is a powerful symbol of hope and the coming of dawn, a natural defiance against the unnatural darkness of the Nazgûl.", "It symbolizes the cowardice of the men of Gondor who are hiding like chickens.", "It is a symbol that time is running out for Gandalf and the city.", "It symbolizes the Nazgûl's final victory over the forces of good."], correctAnswer: "It is a powerful symbol of hope and the coming of dawn, a natural defiance against the unnatural darkness of the Nazgûl.", explanation: "A cock's crow traditionally symbolizes the coming of morning and the end of night. In this moment of absolute darkness and despair, the crow's cry functions as a potent symbol of hope, a natural sound defying the supernatural evil of the Nazgûl just as the sun begins to rise.", additionalExample: "A dove is often used as a symbol of peace, especially when depicted holding an olive branch." },
            { question: "In The Little Prince by Antoine de Saint-Exupéry, how does the Little Prince use personification when describing the stars?", quote: "\"...so it will be as if all the stars will be laughing when you look at the sky at night...\"", answers: ["The quote gives stars the human ability to laugh, transforming them into personal, living reminders of the Prince's affection.", "The quote personifies the narrator by giving him the ability to hear stars laugh.", "The quote gives bells the human ability to laugh.", "The quote personifies the sky by suggesting it is watching the narrator."], correctAnswer: "The quote gives stars the human ability to laugh, transforming them into personal, living reminders of the Prince's affection.", explanation: "The stars, which are inanimate objects, are given the human ability to 'laugh.' This act of personification makes the stars a special, living symbol of the Prince's friendship with the narrator.", additionalExample: "The sentence 'My computer hates me; it keeps crashing' is a common use of personification, giving the human emotion of hatred to a machine." },
            { question: "In Stephen King's The Dark Tower, what is the effect of the simile used to describe laughter in this quote?", quote: "\"Laughter, Susannah would later reflect, is like a hurricane: once it reaches a certain point, it becomes self-feeding, self-supporting.\"", answers: ["Laughter is compared to a hurricane to explain its uncontrollable and \"self-feeding\" nature once it gains momentum.", "The simile is used to show that laughter is a destructive and dangerous force.", "It compares laughter to a hurricane to suggest that it is a rare and unpredictable event.", "The simile emphasizes that laughter is a natural phenomenon."], correctAnswer: "Laughter is compared to a hurricane to explain its uncontrollable and \"self-feeding\" nature once it gains momentum.", explanation: "A simile compares two things using 'like' or 'as.' This simile compares laughter to a hurricane not because it's destructive, but to explain a specific quality: how it builds upon itself and becomes an unstoppable, self-sustaining force once it starts.", additionalExample: "The simile 'He is as strong as an ox' is used to emphasize a person's physical strength by comparing it to a powerful animal." },
            { question: "In The Dark Tower by Stephen King, how does the narrator's final statement serve as direct characterization?", quote: "\"And will I tell you that these three lived happily ever after? I will not, for no one ever does. But there was happiness. And they did live.\"", answers: ["It is a direct characterization of the nature of happiness, rejecting a fairy-tale ideal for a more realistic state of being.", "It directly characterizes the three people as being unhappy.", "It directly characterizes the narrator as a liar.", "It directly characterizes the story as a tragedy with no happiness."], correctAnswer: "It is a direct characterization of the nature of happiness, rejecting a fairy-tale ideal for a more realistic state of being.", explanation: "The narrator directly characterizes not a person, but an abstract concept. The statement explicitly defines happiness not as a permanent 'happily ever after,' but as a real, achievable state that exists within a life that also includes struggle. It's a direct definition of a theme.", additionalExample: "A narrator stating, 'It was the best of times, it was the worst of times,' is a direct characterization of the era's contradictory nature." },
