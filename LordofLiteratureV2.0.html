            { question: "In the Litany Against Fear from Frank Herbert's Dune, what metaphor is used to describe fear?", quote: "\"Fear is the mind-killer. Fear is the little death that brings total obliteration.\"", answers: ["Fear is described as a \"mind-killer\" and a \"little death,\" suggesting it destroys reason and the self.", "Fear is compared to a physical weapon used in battle.", "Fear is described as a beneficial tool for survival.", "The metaphor suggests that fear is a temporary and harmless emotion."], correctAnswer: "Fear is described as a \"mind-killer\" and a \"little death,\" suggesting it destroys reason and the self.", explanation: "The litany uses metaphors to define fear's nature. It's not literally a murderer or a physical death, but it's compared to these things to emphasize its power to destroy a person's rational thought ('mind-killer') and sense of self ('the little death').", additionalExample: "The metaphor 'Her words were daggers' suggests that what she said was sharp, hurtful, and intended to cause pain, like a weapon." },
            { question: "In Richard Stark's Firebreak, how does this opening line use indirect characterization to define Parker?", quote: "\"When the phone rang, Parker was in the garage, killing a man.\"", answers: ["Juxtaposing a mundane event (a phone call) with a violent one (killing) characterizes Parker as ruthlessly professional and detached from his work.", "The line characterizes Parker as a clumsy and inefficient killer for being interrupted by a phone call.", "It shows that Parker is a popular person who receives many phone calls.", "The line characterizes Parker as someone who dislikes being in his garage."], correctAnswer: "Juxtaposing a mundane event (a phone call) with a violent one (killing) characterizes Parker as ruthlessly professional and detached from his work.", explanation: "The matter-of-fact tone and the placement of an extraordinary act ('killing a man') next to an ordinary one ('the phone rang') indirectly characterizes Parker. It shows that for him, killing is a routine part of his life, like answering the phone. This suggests he is a cold and detached professional.", additionalExample: "An opening line like, 'The morning of the execution, the prisoner cooked himself a gourmet breakfast,' would indirectly characterize the prisoner as being unusually calm, defiant, or detached from his fate." },
            { question: "How does the following quote from Shirley Jackson's \"The Lottery\" display and use plot, specifically the climax?", quote: "\"'It isn't fair, it isn't right,' Mrs. Hutchinson screamed, and then they were upon her.\"", answers: ["This line marks the story's climax, the moment of highest tension where the rising action culminates in the horrifying \"winning\" of the lottery.", "The quote shows the falling action, where the consequences of the lottery are revealed.", "The quote is part of the story's exposition, introducing the character of Mrs. Hutchinson.", "The quote serves as the resolution, ending the story with a moral lesson."], correctAnswer: "This line marks the story's climax, the moment of highest tension where the rising action culminates in the horrifying \"winning\" of the lottery.", explanation: "The climax is the peak of the story's action and tension. All the suspense built during the drawing of the lots culminates in this single moment, where the victim is chosen and the story's brutal purpose is fulfilled.", additionalExample: "The climax of *The Avengers* is the final battle in New York City, where all the preceding conflicts and character introductions come to a head." },
            { question: "In \"The Lottery\" by Shirley Jackson, how do the black box and stones function as symbolism?", quote: "\"Although the villagers had forgotten the ritual and lost the original black box, they still remembered to use stones.\"", answers: ["The box symbolizes the decaying, blindly followed tradition, while the stones symbolize the primitive violence at its heart.", "The box symbolizes the secrets of the community, and the stones symbolize their strong foundations.", "The box symbolizes the democratic process, and the stones symbolize the votes of the people.", "The box symbolizes the wealth of the village, and the stones symbolize the hard work of the villagers."], correctAnswer: "The box symbolizes the decaying, blindly followed tradition, while the stones symbolize the primitive violence at its heart.", explanation: "The worn, black box symbolizes the tradition itself—old, falling apart, and its original meaning lost. The stones, however, symbolize the unchanging, brutal violence that the villagers cling to, the true core of the tradition.", additionalExample: "In *Harry Potter*, the snake is a symbol for the house of Slytherin, representing cunning, ambition, and a connection to dark magic." },
            { question: "In \"The Monkey's Paw\" by W.W. Jacobs, how does Mrs. White's dialogue reveal her internal conflict?", quote: "\"'Go and get it and wish,' she cried, and her voice was sharp with pain. 'Oh, my boy, my boy!'\"", answers: ["Her grief and love for her son overpower her reason and fear of the paw, driving her to risk an unknown horror.", "Her words show a conflict between her desire for wealth and her fear of magic.", "She is conflicted about whether to believe Sergeant-Major Morris's stories.", "She is arguing with herself about whether her son's death was her fault."], correctAnswer: "Her grief and love for her son overpower her reason and fear of the paw, driving her to risk an unknown horror.", explanation: "Her internal conflict is between her overwhelming grief and her rational fear of the paw's power. Her desperate love for her son wins out, causing her to demand the second wish despite knowing the terrible potential consequences.", additionalExample: "A character staring at a slice of cake, muttering 'I shouldn't, but I want to,' is expressing a simple internal conflict between desire and discipline." },
            { question: "How does the final line of W.W. Jacobs's \"The Monkey's Paw\" serve as the plot's resolution?", quote: "\"The street lamp flickering opposite shone on a quiet and deserted road.\"", answers: ["It confirms the final wish has been made, the horror has vanished, and the conflict is resolved, leaving the characters in desolate grief.", "It is a cliffhanger that suggests the story is not truly over.", "It is the climax, where the characters finally see what was knocking at the door.", "It is part of the rising action, building suspense for the final confrontation."], correctAnswer: "It confirms the final wish has been made, the horror has vanished, and the conflict is resolved, leaving the characters in desolate grief.", explanation: "The resolution provides the final outcome. The image of the empty road confirms that Mr. White's third wish—for the creature to be gone—has worked. The immediate horror is over, resolving the main conflict, but leaving the family with the tragic consequences.", additionalExample: "The resolution of *Titanic* shows Rose as an old woman, confirming she survived and lived a full life, which resolves the central question of her fate after the sinking." },
            { question: "How does the sensory imagery in Kate Chopin's \"Story of an Hour\" reflect Mrs. Mallard's internal state?", quote: "\"She could see in the open square...the tops of trees that were all aquiver with the new spring life. The delicious breath of rain was in the air...\"", answers: ["The rich sensory details of sight, smell, and sound convey her inner transformation from grief to a quiet, spreading joy.", "The imagery of the rain and clouds reflects the deep sadness and gloom she feels.", "The imagery of the active world outside makes her feel isolated and lonely.", "The sounds of the sparrows and the wind create a chaotic atmosphere that mirrors her confusion."], correctAnswer: "The rich sensory details of sight, smell, and sound convey her inner transformation from grief to a quiet, spreading joy.", explanation: "The imagery appeals to multiple senses—the sight of 'new spring life,' the smell of a 'delicious breath of rain.' These positive, vibrant sensory details mirror her internal awakening and her blossoming feeling of freedom and joy.", additionalExample: "The line 'The winter evening settles down / With smell of steaks in passageways' from T.S. Eliot uses olfactory imagery (smell) to create a specific, urban mood." },
            { question: "In \"Story of an Hour\" by Kate Chopin, how does the final line function as the plot's resolution?", quote: "\"When the doctors came they said she had died of heart disease-of the joy that kills.\"", answers: ["It is a shocking and ironic resolution where the sudden reversal of events leads directly to her death, concluding the narrative.", "It is the story's climax, where Mrs. Mallard's and Mr. Mallard's emotions collide.", "It is part of the falling action, explaining the medical reasons for her death.", "It is the inciting incident that begins the main conflict of the story."], correctAnswer: "It is a shocking and ironic resolution where the sudden reversal of events leads directly to her death, concluding the narrative.", explanation: "This line provides the story's final, ironic outcome. The conflict is resolved by her death, which is caused by the sudden reversal of her fortune (the return of her husband). It's a swift and definitive conclusion to her brief moment of freedom.", additionalExample: "The resolution of 'The Necklace' is the final line revealing the necklace was fake, which cruelly and ironically resolves the story by showing Mathilde's sacrifice was for nothing." },
            { question: "How does the crushed and dried rose function as symbolism in Nathaniel Hawthorne's \"Dr. Heidegger's Experiment\"?", quote: "\"The crushed and dried rose symbolized his past life, withered and without fragrance.\"", answers: ["The rose is a direct symbol of Dr. Heidegger's lost love and the passage of time; its revival symbolizes the potential to revive youth.", "The rose symbolizes the foolishness and vanity of the four guests.", "The rose is a symbol of the scientific method and the pursuit of knowledge.", "The rose symbolizes the beauty and purity of nature."], correctAnswer: "The rose is a direct symbol of Dr. Heidegger's lost love and the passage of time; its revival symbolizes the potential to revive youth.", explanation: "The text explicitly states the rose symbolizes his past. When it is miraculously revived by the water, it becomes a powerful symbol for the central theme of the story: the possibility of reversing time and reviving one's youth.", additionalExample: "The American flag is a symbol of the United States, representing freedom and democracy to its citizens." },
            { question: "What is the plot resolution confirmed by the guests' final decision in \"Dr. Heidegger's Experiment\" by Nathaniel Hawthorne?", quote: "\"They resolved forthwith to make a pilgrimage to Florida, and quaff at morning, noon, and night, from the Fountain of Youth.\"", answers: ["It provides the resolution by confirming the experiment had no positive effect on the guests' wisdom or character.", "It is the story's climax, where the guests turn against Dr. Heidegger.", "It is a cliffhanger, leaving the reader to wonder if they will find the Fountain of Youth.", "It is part of the rising action, setting up the next phase of the experiment."], correctAnswer: "It provides the resolution by confirming the experiment had no positive effect on the guests' wisdom or character.", explanation: "The resolution shows the final outcome of the story's central experiment. By deciding to seek more of the water to repeat their foolish behavior, the guests confirm that they have learned nothing, thus resolving the question of whether they would change if given a second chance.", additionalExample: "The resolution of a mystery novel is when the detective gathers all the suspects and reveals the identity and motive of the killer, resolving the central question of the plot." },
            { question: "What is the effect of the imagery in this quote from \"Old Man at the Bridge\" by Ernest Hemingway?", quote: "\"It was a gray overcast day with a low ceiling so there were no planes.\"", answers: ["The visual image of a bleak, oppressive, and gray day mirrors the old man's hopeless situation.", "The image of the low ceiling creates a sense of claustrophobia and danger.", "The lack of planes creates a peaceful and calm image.", "The gray imagery suggests that the story is a memory from the distant past."], correctAnswer: "The visual image of a bleak, oppressive, and gray day mirrors the old man's hopeless situation.", explanation: "The visual imagery of the 'gray overcast day' and 'low ceiling' creates a somber, oppressive atmosphere. This external setting mirrors the old man's internal state of despair and hopelessness; there is no light or hope in his world, just as there is no light in the sky.", additionalExample: "Bright, sunny imagery in a story often creates a mood of happiness and optimism, while rainy, dark imagery can create a mood of sadness or foreboding." },
            { question: "In Ernest Hemingway's \"Old Man at the Bridge,\" how does the old man's simple statement serve as indirect characterization?", quote: "\"I was only taking care of animals.\"", answers: ["Through his simple speech, he is characterized as a gentle person whose identity is tied to his animals, not the war around him.", "His words characterize him as someone who is trying to make excuses for his inaction.", "He is characterized as unintelligent and unaware of the danger he is in.", "His statement shows he is selfish and only cares about his own responsibilities."], correctAnswer: "Through his simple speech, he is characterized as a gentle person whose identity is tied to his animals, not the war around him.", explanation: "His statement reveals his priorities and identity. In the middle of a war, his entire focus is on the simple, gentle act of caring for animals. This indirectly characterizes him as a simple, non-political man whose world is defined by his duty to other living creatures, not by human conflict.", additionalExample: "A character who constantly talks about money and possessions is indirectly characterized as materialistic." },
            { question: "How does this quote establish the central external conflict of Ray Bradbury's \"The Dragon\"?", quote: "\"A beast of the soul, then, and we will kill it!\"", answers: ["It establishes the conflict of the two knights versus the \"dragon,\" framing their quest in mythic terms.", "It reveals an internal conflict within the knights as they struggle with their fear.", "It establishes a conflict between the two knights over the best way to kill the dragon.", "It introduces a conflict between the knights and the local villagers."], correctAnswer: "It establishes the conflict of the two knights versus the \"dragon,\" framing their quest in mythic terms.", explanation: "This line clearly states the external conflict: the knights (man) intend to fight and kill the dragon (the outside force). It sets up the central action and objective of the characters in the story.", additionalExample: "In *Jaws*, the external conflict is established when the sheriff declares, 'We're gonna need a bigger boat,' cementing the man-vs-nature struggle between the crew and the shark." },
            { question: "What is the central metaphor in \"The Dragon\" by Ray Bradbury, as revealed by this quote?", quote: "\"The train whistle screamed... It was gone. The land was empty. The dragon was gone.\"", answers: ["The train serves as the story's central metaphor for \"the dragon,\" comparing the power of modern technology to ancient monsters.", "The empty land is a metaphor for the knights' feeling of loss and despair.", "The screaming whistle is a metaphor for the knights' own terror.", "The dragon is a metaphor for the knights' inner demons."], correctAnswer: "The train serves as the story's central metaphor for \"the dragon,\" comparing the power of modern technology to ancient monsters.", explanation: "The story operates on a central metaphor where the modern steam train is the 'dragon' that the ancient knights encounter. This comparison of a technological marvel to a mythical beast is the core idea of the entire story.", additionalExample: "George Orwell's *Animal Farm* is an extended metaphor for the Russian Revolution and the rise of Stalinism, with the farm animals representing different political figures and social classes." },
            { question: "How does the destruction of the conch function within the plot of William Golding's Lord of the Flies?", quote: "\"...the conch exploded into a thousand white fragments and ceased to exist.\"", answers: ["This moment is the story's climax, where the conflict results in murder and the final loss of hope for a civil society.", "This is the resolution of the story, symbolizing the end of the boys' time on the island.", "This is part of the rising action, increasing the tension between Ralph and Jack.", "This is the inciting incident that first causes the boys to turn against each other."], correctAnswer: "This moment is the story's climax, where the conflict results in murder and the final loss of hope for a civil society.", explanation: "The climax is the moment of highest intensity. The shattering of the conch, combined with Piggy's murder, represents the peak of the conflict between Ralph's faction of civilization and Jack's faction of savagery. At this moment, savagery definitively wins.", additionalExample: "The climax in Shakespeare's *Romeo and Juliet* occurs when Romeo kills Tybalt, an irreversible act that forces him to flee and leads directly to the play's tragic conclusion." },
            { question: "In Lord of the Flies by William Golding, how do Jack's actions and appearance in this quote serve as indirect characterization?", quote: "\"He capered toward Bill, and the mask was a thing on its own, behind which Jack hid, liberated from shame and self-consciousness.\"", answers: ["Through his actions (capering) and looks (the mask), he is characterized as someone shedding his civilized identity and descending into savagery.", "His playful capering characterizes him as a fun-loving and carefree leader.", "The mask characterizes him as a shy individual who needs to hide his face.", "His actions toward Bill characterize him as a kind and friendly person."], correctAnswer: "Through his actions (capering) and looks (the mask), he is characterized as someone shedding his civilized identity and descending into savagery.", explanation: "We learn about Jack through his actions. 'Capering' is a wild, uncontrolled movement, and hiding behind the mask liberates him from shame. These actions indirectly characterize him as someone who is embracing a more primitive, savage identity.", additionalExample: "A character who always arrives late and with clothes disheveled is indirectly characterized as disorganized and careless." },
            { question: "How does Ralph's weeping reveal his internal conflict at the end of William Golding's Lord of the Flies?", quote: "\"Ralph wept for the end of innocence, the darkness of man's heart, and the fall through the air of the true, wise friend called Piggy.\"", answers: ["His weeping reveals his profound internal conflict as he grapples with the terrible realization of what the boys are capable of.", "He is conflicted about whether he is happy or sad to be rescued.", "The weeping shows his external conflict with the naval officer.", "He is conflicted about whether he should have been a better leader to Piggy."], correctAnswer: "His weeping reveals his profound internal conflict as he grapples with the terrible realization of what the boys are capable of.", explanation: "Ralph isn't just crying because he's sad to lose his friend. He is crying because he is struggling with the horrific new understanding he has about human nature. This realization about 'the darkness of man's heart' is a deep internal conflict between his former innocent view of the world and the brutal reality he has experienced.", additionalExample: "A soldier who returns from war and struggles to reconcile their actions with their moral beliefs is experiencing a profound internal conflict." },
            { question: "In George Orwell's Animal Farm, how does the betrayal of Boxer serve as indirect characterization of the pigs?", quote: "\"'They are taking Boxer to the knacker's!' cried Benjamin.\"", answers: ["The event has a profound effect on other characters and characterizes the pigs as utterly ruthless and corrupt.", "The event characterizes the pigs as practical and business-minded leaders.", "This action indirectly characterizes Benjamin as a hysterical and unreliable narrator.", "It characterizes the pigs as caring, as they are sending Boxer to what they believe is a hospital."], correctAnswer: "The event has a profound effect on other characters and characterizes the pigs as utterly ruthless and corrupt.", explanation: "The pigs' action of selling their most loyal worker for their own profit (whiskey) is a powerful act of indirect characterization. It shows the reader, through their deeds, that they are completely selfish, tyrannical, and have no regard for the ideals they once preached.", additionalExample: "In the Bible, Judas's act of betraying Jesus for thirty pieces of silver indirectly characterizes him as greedy and treacherous." },
            { question: "In Animal Farm by George Orwell, what is the effect of the imagery in the first description of the pigs walking on two legs?", quote: "\"It was a pig walking on his hind legs.\"", answers: ["The simple declarative sentence creates a shocking and powerful visual image that signifies the final death of the revolution.", "The imagery creates a comical and lighthearted moment, reducing the tension.", "The visual image is meant to inspire the other animals to work harder.", "The imagery is confusing and makes it difficult to understand what is happening."], correctAnswer: "The simple declarative sentence creates a shocking and powerful visual image that signifies the final death of the revolution.", explanation: "The power of this image comes from its simplicity and starkness. The visual of a pig walking like a human is unnatural and deeply unsettling. It provides a clear, shocking picture that symbolizes the complete and final corruption of the pigs.", additionalExample: "The image of the single, defiant protestor standing in front of a line of tanks in Tiananmen Square is a powerful visual that conveys themes of courage and resistance." },
            { question: "In George Orwell's Animal Farm, how does the final scene function as the plot's resolution?", quote: "\"The creatures outside looked from pig to man... but already it was impossible to say which was which.\"", answers: ["It is the novel's resolution, where the animals and the reader see that the cycle of tyranny is complete and the pigs have become indistinguishable from the humans.", "It is the climax of the story, where the animals finally rise up against the pigs.", "It is a cliffhanger, leaving the reader to wonder if the animals will ever be free.", "It is part of the falling action, showing the new alliance between pigs and humans."], correctAnswer: "It is the novel's resolution, where the animals and the reader see that the cycle of tyranny is complete and the pigs have become indistinguishable from the humans.", explanation: "The resolution provides the final outcome of the story. The image of pigs and men being indistinguishable is the final state of the farm. It resolves the story's central conflict by showing that the revolution has completely failed and resulted in a tyranny identical to the one it replaced.", additionalExample: "The resolution of the original *Planet of the Apes* is the final scene revealing the Statue of Liberty, which resolves the mystery of where the protagonist has been all along." },
            { question: "In William Shakespeare's Macbeth, how does the vision of the dagger reveal Macbeth's internal conflict?", quote: "\"Is this a dagger which I see before me, / The handle toward my hand?\"", answers: ["The soliloquy shows he is torn between his ambition to be king and his awareness that murdering Duncan is a terrible, immoral act.", "He is conflicted about whether the dagger is real or a hallucination.", "The vision reveals his conflict with Lady Macbeth, who is pressuring him to kill the king.", "He is struggling with an external conflict against the king's guards."], correctAnswer: "The soliloquy shows he is torn between his ambition to be king and his awareness that murdering Duncan is a terrible, immoral act.", explanation: "The hallucination is a manifestation of his internal conflict. His ambition makes him see the dagger, leading him toward the murder. His guilt and fear make the dagger bloody and unreal. The vision perfectly captures the war within his own mind.", additionalExample: "In *Fight Club*, the narrator's entire struggle with Tyler Durden is a physical manifestation of his internal conflict with his own personality and modern society." },
            { question: "In Macbeth by William Shakespeare, how does Lady Macbeth's obsession with the \"damned spot\" relate to a recurring motif?", quote: "\"Out, damned spot! Out, I say! ...Here's the smell of the blood still.\"", answers: ["It culminates the recurring motif of blood, which represents guilt throughout the play, as she is now haunted by an imaginary stain.", "It relates to the motif of sleep, as she is sleepwalking while she says this.", "It culminates the motif of clothing, as she is trying to wash a spot out of her dress.", "It relates to the motif of prophecy, as the witches predicted she would be driven mad."], correctAnswer: "It culminates the recurring motif of blood, which represents guilt throughout the play, as she is now haunted by an imaginary stain.", explanation: "The motif of blood appears again and again in the play to represent guilt. This scene is the culmination of that motif. Where she once confidently said 'a little water clears us of this deed,' she is now driven mad by an imaginary bloodstain that can never be washed away, showing the permanence of her guilt.", additionalExample: "In F. Scott Fitzgerald's *The Great Gatsby*, the motif of the color green (the green light, the 'fresh, green breast of the new world') recurs to represent hope and the unattainable dream." },
            { question: "In William Shakespeare's Macbeth, how does Macbeth's \"poor player\" speech serve as indirect characterization?", quote: "\"Life's but a walking shadow, a poor player / That struts and frets his hour upon the stage...\"", answers: ["Through the nihilistic thoughts in this speech, Macbeth is characterized as a broken man who now believes life itself is meaningless.", "The speech characterizes him as a bad actor who is jealous of more successful players.", "It characterizes him as an arrogant king who looks down on common entertainers.", "The speech shows he is a religious man contemplating the afterlife."], correctAnswer: "Through the nihilistic thoughts in this speech, Macbeth is characterized as a broken man who now believes life itself is meaningless.", explanation: "This speech reveals Macbeth's state of mind. His comparison of life to a brief, meaningless play shows his complete descent into despair and nihilism. His actions have cost him everything, and he is indirectly characterized as a man who has lost all hope and purpose.", additionalExample: "A character who constantly tells pessimistic jokes and makes cynical observations about the world is indirectly characterized as a nihilist or a pessimist." },
            { question: "In Mary Shelley's Frankenstein, what metaphor does the Creature use to frame his creation?", quote: "\"Did I request thee, Maker, from my clay / To mould Me man, did I solicit thee / From darkness to promote me?\"", answers: ["The metaphor of molding man from clay compares Victor's act to the divine creation of Adam, emphasizing a creator's responsibility.", "The metaphor of clay suggests that the Creature feels he is unformed and incomplete.", "\"Darkness\" is a metaphor for the Creature's lack of intelligence before he was brought to life.", "The metaphor of a \"Maker\" implies the Creature sees Victor as a god-like figure to be worshipped."], correctAnswer: "The metaphor of molding man from clay compares Victor's act to the divine creation of Adam, emphasizing a creator's responsibility.", explanation: "The metaphor here alludes to the biblical story of God creating Adam from clay. By using this comparison, the Creature is elevating his creation to a divine level, thereby highlighting the immense responsibility that Victor, his 'Maker,' has failed to uphold.", additionalExample: "The metaphor 'The classroom was a zoo' compares the chaotic energy of the students to wild animals, emphasizing the lack of control." },
            { question: "In Frankenstein by Mary Shelley, how does the Creature's speech serve as indirect characterization?", quote: "\"I ought to be thy Adam, but I am rather the fallen angel, whom thou drivest from joy for no misdeed.\"", answers: ["His eloquent and self-aware speech characterizes him as intelligent and deeply wounded, capable of understanding his own tragic existence.", "The speech characterizes him as arrogant and self-pitying.", "It characterizes him as a monster who is trying to manipulate Victor with clever words.", "His reference to the Bible characterizes him as a devoutly religious being."], correctAnswer: "His eloquent and self-aware speech characterizes him as intelligent and deeply wounded, capable of understanding his own tragic existence.", explanation: "The Creature's ability to use complex biblical allusions and articulate his philosophical pain shows that he is not a mindless monster. His speech indirectly characterizes him as a thinking, feeling being with a deep capacity for suffering and a clear understanding of his own tragedy.", additionalExample: "A character who speaks in short, clipped sentences and uses simple vocabulary might be indirectly characterized as uneducated, stoic, or straightforward." },
            { question: "In Mary Shelley's Frankenstein, how is the description of \"burning miseries\" an example of personification?", quote: "\"Soon these burning miseries will be extinct. I shall ascend my funeral pile triumphantly and exult in the agony of the torturing flames.\"", answers: ["The abstract feeling of misery is given the physical, fiery quality of \"burning,\" emphasizing how actively it has tormented him.", "The funeral pile is personified as being triumphant.", "The flames are personified by being described as torturing him.", "The quote gives the human quality of being extinct to his miseries."], correctAnswer: "The abstract feeling of misery is given the physical, fiery quality of \"burning,\" emphasizing how actively it has tormented him.", explanation: "Personification gives human or physical qualities to abstract ideas. Misery is an emotion and cannot literally burn. By describing his miseries as 'burning,' the Creature gives them an active, physical quality, emphasizing the intense pain they have caused him.", additionalExample: "The phrase 'Opportunity was knocking at the door' is personification, giving the action of knocking to the abstract concept of opportunity." },
            { question: "In Edgar Allan Poe's \"The Cask of Amontillado,\" how does this description of the descent into the catacombs function as part of the plot?", quote: "\"We passed through a range of low arches, descended, passed on, and descending again, arrived at a deep crypt...\"", answers: ["It is part of the rising action, methodically taking the reader deeper and building suspense as Montresor leads Fortunato to his doom.", "It is the story's exposition, providing background information on the catacombs.", "It is the climax of the story, where the final confrontation occurs.", "It is the resolution, describing Montresor's escape route after the deed is done."], correctAnswer: "It is part of the rising action, methodically taking the reader deeper and building suspense as Montresor leads Fortunato to his doom.", explanation: "The rising action consists of the events that build suspense and lead to the climax. The slow, methodical journey deeper and deeper into the catacombs creates immense tension and suspense, as the reader knows they are heading towards a terrible conclusion.", additionalExample: "In a heist movie, the rising action includes the scenes of the team gathering, planning the job, and overcoming small obstacles before the main heist begins." },
            { question: "In \"The Cask of Amontillado\" by Edgar Allan Poe, how does this exchange mark the climax of the external conflict?", quote: "\"'For the love of God, Montresor!' 'Yes,' I said, 'for the love of God!'\"", answers: ["It is the final, desperate plea from Fortunato met with a cold, mocking reply, sealing his fate at the peak of the conflict.", "It marks the end of the internal conflict within Montresor, who now feels remorse.", "It marks the beginning of the external conflict, as Fortunato finally realizes he has been deceived.", "It shows a conflict between Montresor and his conscience."], correctAnswer: "It is the final, desperate plea from Fortunato met with a cold, mocking reply, sealing his fate at the peak of the conflict.", explanation: "The climax is the point of greatest intensity. Fortunato's final, desperate plea is his last attempt to escape. Montresor's cold, mocking reply signifies the absolute end of any hope. This is the peak of the confrontation, after which all that remains is the final act of walling him in.", additionalExample: "The climax of the film *Jaws* is the final confrontation where Brody shoves the scuba tank into the shark's mouth and shoots it, causing it to explode." },
            { question: "In Saki's The Interlopers, what is the narrative function of this shared prayer in the plot?", quote: "\"And each prayed a private prayer that his men might be the first to arrive, so that he might be the first to show honorable attention to the enemy that had become a friend.\"", answers: ["It is the story's turning point, where the central conflict shifts from man vs. man to man vs. nature, setting up the finale.", "It is the resolution of the story, as the men's prayers are answered.", "It is the exposition that explains why the men are enemies.", "It is the climax, where the men fight for survival."], correctAnswer: "It is the story's turning point, where the central conflict shifts from man vs. man to man vs. nature, setting up the finale.", explanation: "A turning point shifts the story's direction. At this moment, the men have reconciled, ending their man-vs-man conflict. The story now pivots to a new conflict: their shared struggle for survival against the elements (man vs. nature), as they wait for rescue.", additionalExample: "In *Breaking Bad*, a major turning point is when Walter White lets Jane die, a decision that marks a significant step in his transformation from a sympathetic character to a ruthless villain." },
            { question: "In The Interlopers by Saki, what is the primary effect of the imagery in the word \"Wolves\"?", quote: "\"Wolves.\"", answers: ["It instantly conjures a terrifying visual and auditory image, leaving the reader to imagine the men's gruesome fate.", "It creates a peaceful image of nature and the wilderness.", "It creates an image of hope, as the wolves might lead rescuers to the men.", "It creates a confusing image that does not fit with the rest of the story."], correctAnswer: "It instantly conjures a terrifying visual and auditory image, leaving the reader to imagine the men's gruesome fate.", explanation: "The single word 'Wolves' is powerful imagery because it instantly creates a picture of approaching predators in the reader's mind. It simultaneously appeals to our sense of sight (picturing the wolves) and sound (imagining their howls), creating a final, horrifying impression.", additionalExample: "The line 'The child's scream echoed in the silence' uses auditory imagery to create a powerful and unsettling effect with just a few words." },
            { question: "In Guy de Maupassant's The Necklace, what is the effect of the imagery used to describe Mathilde's transformation?", quote: "\"With frowsy hair, with skirts awry, and with red hands, she talked loud while washing the floor with great swishes of water.\"", answers: ["The stark visual image of her coarseness emphasizes the harshness of her new reality compared to her former self.", "The imagery of \"red hands\" and \"frowsy hair\" creates a sense of romantic poverty.", "The auditory imagery of her talking loud suggests she has become more powerful and confident.", "The imagery of her washing the floor shows her dedication to cleanliness."], correctAnswer: "The stark visual image of her coarseness emphasizes the harshness of her new reality compared to her former self.", explanation: "The visual imagery provides a strong contrast to how Mathilde was at the start of the story. The description of her as unkempt and rough ('frowsy hair,' 'red hands') creates a clear picture for the reader of just how profoundly the years of hard labor have changed her.", additionalExample: "Charles Dickens uses powerful visual imagery to describe the poverty of Victorian London, with descriptions of 'filthy streets' and 'gaunt children' to create a vivid picture of hardship." },
            { question: "In The Necklace by Guy de Maupassant, how does the revelation about the necklace serve as the story's plot climax?", quote: "\"'Oh, my poor Mathilde! Why, my necklace was paste. It was worth at most five hundred francs!'\"", answers: ["This devastating revelation is the story's cruel, ironic climax, rendering Mathilde's decade of sacrifice completely pointless.", "This is the rising action, as it creates a new problem for Mathilde to solve.", "This is the resolution, where all of Mathilde's problems are finally solved.", "This is the exposition, setting up the reason why Mathilde needs to borrow the necklace."], correctAnswer: "This devastating revelation is the story's cruel, ironic climax, rendering Mathilde's decade of sacrifice completely pointless.", explanation: "The climax is the peak of the story's tension and emotional impact. This final revelation is the most intense moment of the story, as both Mathilde and the reader realize with horror that her entire ten years of suffering and sacrifice were based on a mistake.", additionalExample: "The climax of a romance novel is often the moment when the two main characters finally overcome the central obstacle to their relationship and declare their love for one another." },
            { question: "In O. Henry's The Gift of the Magi, what does Della's hair symbolize?", quote: "\"'You've cut off your hair?' asked Jim... 'Cut it off and sold it,' said Della.\"", answers: ["Her hair, her most prized possession, symbolizes her beauty; sacrificing it symbolizes the depth of her love, which she values more than vanity.", "Her hair symbolizes her youth and innocence, which she loses by cutting it.", "The act of selling her hair symbolizes her rejection of societal beauty standards.", "Her hair symbolizes her connection to her family and her past."], correctAnswer: "Her hair, her most prized possession, symbolizes her beauty; sacrificing it symbolizes the depth of her love, which she values more than vanity.", explanation: "Della's beautiful hair is her defining physical feature and a symbol of her vanity. By choosing to cut and sell it, she sacrifices her personal pride for her love of Jim. The act symbolizes that her love is more valuable to her than her own beauty.", additionalExample: "In many cultures, a lion is a symbol of courage and royalty." },
            { question: "In The Gift of the Magi by O. Henry, how does the narrator use direct characterization in the story's conclusion?", quote: "\"But in a last word to the wise of these days let it be said that of all who give gifts these two were the wisest...\"", answers: ["The narrator uses direct characterization by explicitly stating that Della and Jim \"were the wisest,\" leaving no room for interpretation.", "The narrator directly characterizes the Magi as wise gift-givers.", "The narrator directly characterizes \"the wise of these days\" as foolish.", "The narrator directly characterizes the gifts themselves as wise."], correctAnswer: "The narrator uses direct characterization by explicitly stating that Della and Jim \"were the wisest,\" leaving no room for interpretation.", explanation: "Direct characterization occurs when the narrator explicitly tells the audience about a character's traits. Here, the narrator leaves no room for doubt, directly stating the judgment that Jim and Della 'were the wisest.'", additionalExample: "The opening line, 'Mr. Utterson the lawyer was a man of a rugged countenance that was never lighted by a smile,' from *Dr. Jekyll and Mr. Hyde* is a clear example of direct characterization." },
            { question: "In Richard Connell's The Most Dangerous Game, how does the contrast in speech serve as indirect characterization for both Rainsford and Zaroff?", quote: "\"'Hunting? General Zaroff, what you speak of is murder.'\"", answers: ["Rainsford is shown to be civilized and moral, while Zaroff is revealed to be a cold monster who sees no distinction between hunting animals and humans.", "The quote characterizes Rainsford as naive and Zaroff as a wise teacher.", "The dialogue characterizes both men as being from a high social class.", "Rainsford is characterized as being aggressive, while Zaroff is characterized as being calm."], correctAnswer: "Rainsford is shown to be civilized and moral, while Zaroff is revealed to be a cold monster who sees no distinction between hunting animals and humans.", explanation: "The difference in how they speak about the same topic reveals their characters. Rainsford's horrified reaction ('murder') shows he has a strong moral compass. Zaroff's casual discussion of hunting men shows he lacks that compass entirely, characterizing him as amoral and monstrous.", additionalExample: "A character who uses sophisticated vocabulary and complex sentences is indirectly characterized as educated, while a character who uses slang and speaks in fragments is characterized as less formal or perhaps uneducated." },
            { question: "In The Most Dangerous Game by Richard Connell, what does the final line reveal about the plot's resolution?", quote: "\"He had never slept in a better bed, Rainsford decided.\"", answers: ["It confirms that Rainsford has won the game and killed Zaroff, bringing the central conflict to a definitive close.", "It resolves the plot by showing that Rainsford has decided to stay and live on the island.", "It is an ambiguous ending, leaving the reader to wonder if Zaroff is truly dead.", "It resolves the plot by showing that Rainsford has forgiven Zaroff."], correctAnswer: "It confirms that Rainsford has won the game and killed Zaroff, bringing the central conflict to a definitive close.", explanation: "The resolution is the final outcome. The fact that Rainsford is sleeping in Zaroff's bed confirms that he has defeated and killed Zaroff, thus winning the 'game.' This definitively ends the man-vs-man conflict that drove the story.", additionalExample: "The resolution of most fairy tales is the line '...and they lived happily ever after,' which confirms the final, positive outcome for the main characters." },
            { question: "In William Shakespeare's Romeo and Juliet, how does Romeo's poetic speech serve as indirect characterization?", quote: "\"But, soft! what light through yonder window breaks? / It is the east, and Juliet is the sun.\"", answers: ["Through this passionate soliloquy, Romeo is characterized as intensely romantic and impulsive.", "His speech characterizes him as a skilled astronomer with a deep knowledge of the sun.", "The quote characterizes him as a shy person who is afraid to speak to Juliet directly.", "His words characterize him as arrogant, as he compares his love to the sun."], correctAnswer: "Through this passionate soliloquy, Romeo is characterized as intensely romantic and impulsive.", explanation: "The way a character speaks reveals their personality. Romeo's use of elevated, poetic language and grand metaphors ('Juliet is the sun') characterizes him as a passionate, romantic, and somewhat dramatic young man who falls in love deeply and quickly.", additionalExample: "A character who speaks sarcastically and makes frequent jokes is indirectly characterized as witty or cynical." },
            { question: "In Romeo and Juliet by William Shakespeare, how does Mercutio's death function as a turning point in the plot?", quote: "\"A plague o' both your houses! / They have made worms' meat of me.\"", answers: ["His death is the crucial turning point where the play shifts from a romance with comedic elements to an inescapable tragedy.", "His death resolves the main conflict of the play.", "His death is the inciting incident that begins the romance between Romeo and Juliet.", "His death is a minor plot point that has little effect on the overall story."], correctAnswer: "His death is the crucial turning point where the play shifts from a romance with comedic elements to an inescapable tragedy.", explanation: "Up to this point, the play has moments of comedy and hope. Mercutio's death and Romeo's subsequent revenge are the turning point because they are irreversible acts that directly lead to Romeo's banishment and the series of tragic miscommunications that follow. From this point on, the play becomes a pure tragedy.", additionalExample: "In a war movie, the turning point might be a single major battle that shifts the momentum of the war, leading to the final outcome." },
            { question: "In William Shakespeare's Romeo and Juliet, how does Juliet's final act serve as the plot's resolution?", quote: "\"O happy dagger! / This is thy sheath; there rust, and let me die.\"", answers: ["Her suicide is the tragic climax and resolution of the play, completing the tragedy set in motion by the family feud.", "It is a cliffhanger, as the audience does not know if the dagger will work.", "It is part of the rising action, as it will lead to the final confrontation between the families.", "It resolves the plot by bringing peace to the two families."], correctAnswer: "Her suicide is the tragic climax and resolution of the play, completing the tragedy set in motion by the family feud.", explanation: "Juliet's suicide is the final piece of the tragedy. It is the ultimate consequence of the feud and the miscommunication, bringing the story of the two lovers to its definitive, heartbreaking end. The subsequent reconciliation of the families is part of the falling action, but her death is the resolution of her own story.", additionalExample: "The resolution of the movie *Gladiator* is Maximus's death after he has successfully killed Commodus and restored the dream of Rome, bringing his personal story to a complete end." },
            { question: "In John Steinbeck's Of Mice and Men, how does Crooks's speech serve as indirect characterization?", quote: "\"A guy goes nuts if he ain't got nobody. Don't make no difference who the guy is, long's he's with you.\"", answers: ["His pained and insightful speech characterizes him as intelligent and deeply wounded by his solitude, revealing a desperate yearning for companionship.", "The quote characterizes him as a mean and bitter person who enjoys seeing others suffer.", "His words characterize him as a simple-minded person who cannot express himself clearly.", "The speech shows that he is a gossip who likes to talk about other people's problems."], correctAnswer: "His pained and insightful speech characterizes him as intelligent and deeply wounded by his solitude, revealing a desperate yearning for companionship.", explanation: "Crooks's philosophical words about loneliness reveal his inner state. Despite his cynical exterior, his speech shows that he is intelligent and has thought deeply about his own isolation. It characterizes him as someone who is profoundly lonely and yearns for connection.", additionalExample: "A character who constantly criticizes others' work might be indirectly characterized as insecure or jealous." },
            { question: "In Of Mice and Men by John Steinbeck, how does George's killing of Lennie resolve the plot?", quote: "\"He pulled the trigger. The crash of the shot rolled up the hills and rolled down again. Lennie jarred, and then settled slowly forward to the sand...\"", answers: ["It is the novel's tragic climax and resolution, ending their shared dream and resolving George's terrible internal conflict.", "It resolves the plot by allowing George to finally be free from his responsibility to Lennie.", "It is part of the rising action, as it will lead to George's arrest and trial.", "It resolves the conflict between Lennie and Curley."], correctAnswer: "It is the novel's tragic climax and resolution, ending their shared dream and resolving George's terrible internal conflict.", explanation: "This act is both the climax (most intense moment) and the resolution (final outcome) of the plot. It definitively ends the central storyline of George and Lennie's shared dream and their struggle against the world. It also resolves George's internal conflict over what to do about Lennie's escalating dangerousness.", additionalExample: "The resolution of a revenge story is typically the moment the protagonist finally confronts and defeats their nemesis, bringing the central plot to a close." },
            { question: "In John Steinbeck's Of Mice and Men, how does Lennie's speech to the dead puppy serve as indirect characterization?", quote: "\"'Why do you got to get killed? You ain't so little as mice. I didn't bounce you hard.'\"", answers: ["His speech characterizes him as childlike and morally innocent, as he does not understand the consequences of his own power.", "The quote characterizes him as cruel and violent, as he shows no remorse for killing the puppy.", "His words characterize him as a liar, as he is trying to deny that he killed the puppy.", "The speech shows he is intelligent enough to compare the puppy to the mice he killed earlier."], correctAnswer: "His speech characterizes him as childlike and morally innocent, as he does not understand the consequences of his own power.", explanation: "His words show his childlike mind. He speaks to the puppy as if it's alive and blames it for getting killed. This shows he doesn't grasp the finality of death or the fact that his own strength is the cause of the tragedy, characterizing him as morally innocent but dangerously unaware.", additionalExample: "A child who draws on the walls and then asks the crayon why it was naughty is indirectly characterized as innocent and unable to understand their own responsibility." },
            { question: "In Harper Lee's To Kill a Mockingbird, how does shooting the mad dog serve as indirect characterization for Atticus?", quote: "\"Atticus was the deadest shot in Maycomb County in his time.\"", answers: ["The surprising action reveals a hidden, formidable strength, profoundly affecting his children's perception of their quiet, intellectual father.", "It characterizes Atticus as a violent man who enjoys shooting.", "The act characterizes him as a reckless person who puts his children in danger.", "It shows he is a conformist who gives in to the sheriff's demands."], correctAnswer: "The surprising action reveals a hidden, formidable strength, profoundly affecting his children's perception of their quiet, intellectual father.", explanation: "This action reveals a surprising aspect of Atticus's character. His children see him as old and bookish, but his skill with a rifle shows them a hidden strength and capability. It characterizes him as a man who possesses necessary force but chooses not to use it unless absolutely necessary, a man of quiet strength.", additionalExample: "A quiet librarian who, during an emergency, takes charge and directs everyone to safety is indirectly characterized as a hidden leader through their actions." },
            { question: "In To Kill a Mockingbird by Harper Lee, how does Atticus's speech to the jury serve as indirect characterization?", quote: "\"'But there is one way in this country in which all men are created equal... That institution, gentlemen, is a court.'\"", answers: ["His powerful and idealistic speech characterizes him as a man of unwavering principle and integrity.", "The speech characterizes him as a naive idealist who does not understand the reality of his town.", "It characterizes him as a skilled lawyer who knows how to manipulate a jury.", "His words characterize him as a patriot who believes his country is perfect."], correctAnswer: "His powerful and idealistic speech characterizes him as a man of unwavering principle and integrity.", explanation: "Atticus's words reveal his core beliefs. Even in the face of overwhelming prejudice, he appeals to the highest ideals of justice and equality. His speech characterizes him as a man of deep integrity who holds firm to his principles, regardless of the personal cost.", additionalExample: "A coach giving a rousing, inspirational speech to their losing team is indirectly characterized as a strong leader and motivator." },
            { question: "In Harper Lee's To Kill a Mockingbird, how do Scout's final thoughts on the Radley porch serve as indirect characterization?", quote: "\"Atticus was right. One time he said you never really know a man until you stand in his shoes and walk around in them. Just standing on the Radley porch was enough.\"", answers: ["Her mature and reflective thoughts characterize her as having finally learned the novel's central lesson in empathy.", "Her thoughts characterize her as a disobedient child for being on the Radley porch.", "The quote characterizes her as someone who is still fearful of Boo Radley.", "Her reflection characterizes her as someone who will never change her mind about people."], correctAnswer: "Her mature and reflective thoughts characterize her as having finally learned the novel's central lesson in empathy.", explanation: "Her thoughts reveal her growth. By finally seeing the world from Boo Radley's point of view, she demonstrates a newfound maturity and understanding. This internal reflection indirectly characterizes her as a changed person who has absorbed her father's most important lesson.", additionalExample: "A character's internal monologue worrying about their friends' safety characterizes them as caring and compassionate." },
            { question: "In Terry Pratchett's Wyrd Sisters, how is Granny Weatherwax indirectly characterized through her thoughts on anger?", quote: "\"Genuine anger was one of the world's great creative forces, but you had to learn how to control it...\"", answers: ["She is characterized as intensely powerful, disciplined, and strategic, a person who controls and weaponizes her anger.", "She is characterized as a very angry and unpleasant person.", "She is characterized as someone who is afraid of her own emotions.", "She is characterized as a creative artist who uses anger as inspiration."], correctAnswer: "She is characterized as intensely powerful, disciplined, and strategic, a person who controls and weaponizes her anger.", explanation: "Her thoughts on anger reveal her personality. She doesn't see anger as a negative emotion but as a powerful tool to be controlled and used. This characterizes her as someone who is highly disciplined, strategic, and not afraid of her own power.", additionalExample: "A character who thinks, 'Revenge is a dish best served cold,' is indirectly characterized as patient, calculating, and potentially ruthless." },
            { question: "In this quote by William S. Burroughs, how does the speaker's cynical tone serve as indirect characterization?", quote: "\"Most of the trouble in this world has been caused by folks who can't mind their own business, because they have no business of their own to mind, any more than a smallpox virus has.\"", answers: ["Their tone characterizes them as misanthropic and world-weary, reducing complex human behavior to a simple, pathological impulse.", "The speaker is characterized as a scientist or doctor due to their reference to a virus.", "The tone characterizes the speaker as a busybody who is complaining about others.", "The speaker is characterized as a cheerful and optimistic person."], correctAnswer: "Their tone characterizes them as misanthropic and world-weary, reducing complex human behavior to a simple, pathological impulse.", explanation: "Tone is the attitude of the speaker. The dismissive and contemptuous comparison of people to a virus reveals a cynical and misanthropic (hating mankind) tone. This indirectly characterizes the speaker as someone who has a very low opinion of humanity.", additionalExample: "A character who says, 'Oh, great, another beautiful sunny day,' in a flat, monotone voice is using a sarcastic tone that indirectly characterizes them as pessimistic or unhappy." },
            { question: "In this quote from Albert Camus, how does the statement use a metaphor to describe the struggle against adversity?", quote: "\"No matter how hard the world pushes against me, within me, there's something stronger - something better, pushing right back.\"", answers: ["It uses the metaphor of pushing and resistance, with the \"world\" as a physical force and the human spirit as an opposing force.", "It uses the metaphor of a competition or game that the speaker is determined to win.", "It uses the metaphor of an argument, where the speaker is \"pushing back\" against a different opinion.", "It uses the metaphor of a physical wall within the speaker that protects them."], correctAnswer: "It uses the metaphor of pushing and resistance, with the \"world\" as a physical force and the human spirit as an opposing force.", explanation: "The quote uses the physical actions of 'pushing' and 'pushing back' as a metaphor for the struggle between life's hardships (external pressure) and a person's inner resilience (internal strength). It's a metaphor of opposing forces.", additionalExample: "The metaphor 'He was drowning in paperwork' compares the overwhelming amount of work to the physical act of drowning to emphasize the feeling of being submerged and unable to cope." },
            { question: "As an act of speech, how does the word \"No,\" as cited by the author, serve as indirect characterization?", quote: "\"'No.' - Shiprah and Puah, David, Spartacus, Leonidas of Sparta, Socrates\"", answers: ["This single word characterizes the speakers as possessing immense courage and conviction in a pivotal moment.", "It characterizes the speakers as negative and uncooperative.", "The word characterizes the speakers as being indecisive.", "It characterizes the speakers as being rude and disrespectful."], correctAnswer: "This single word characterizes the speakers as possessing immense courage and conviction in a pivotal moment.", explanation: "In the context of the historical figures listed, all of whom defied authority at great personal risk, the simple act of saying 'No' characterizes them as incredibly brave and principled. The power of the speech act reveals their character.", additionalExample: "A character who responds to a complex moral question with a simple, firm 'Yes' is indirectly characterized as decisive and confident in their beliefs." },
            { question: "What metaphor does the narrator use to describe the evil of the masses in Terry Pratchett's Guards! Guards!?", quote: "\"Down there...are people who will follow any dragon... All out of a kind of humdrum, everyday badness...\"", answers: ["The narrator uses the metaphor of \"mass-produced darkness of the soul\" to suggest their evil is common and cheaply made.", "The dragon is used as a metaphor for a tyrannical leader.", "The people are compared to sheep who will follow any leader.", "\"Down there\" is a metaphor for a place of moral corruption."], correctAnswer: "The narrator uses the metaphor of \"mass-produced darkness of the soul\" to suggest their evil is common and cheaply made.", explanation: "The narrator uses a metaphor drawn from manufacturing ('mass-produced') to describe the nature of everyday evil. This suggests that this type of badness is not rare or special, but common, unoriginal, and easy to find, like a cheap factory-made product.", additionalExample: "A writer might use the metaphor 'a garden of creativity' to suggest that ideas need to be planted, nurtured, and cultivated in order to grow." },
            { question: "In Victor Hugo's Les Miserables, how does the description of the commoner's blouse function as a simile?", quote: "\"...his blouse drapes itself like the folds of a chlamys...\"", answers: ["The simile compares a common blouse to a Greek cloak (a chlamys) to elevate the working man to the status of a classical hero.", "The simile is used to suggest that the man is wearing a costume.", "It compares the blouse to a cloak to show that the man is trying to hide something.", "The simile emphasizes how fashionable and well-dressed the man is."], correctAnswer: "The simile compares a common blouse to a Greek cloak (a chlamys) to elevate the working man to the status of a classical hero.", explanation: "A simile uses 'like' or 'as' to make a comparison. By comparing a simple worker's blouse to the classical Greek 'chlamys,' Hugo is elevating the common man, suggesting he has the same dignity and heroic potential as an ancient Greek hero.", additionalExample: "The simile 'The clouds were like cotton balls' compares the appearance of clouds to something soft and fluffy to create a gentle visual image." },
            { question: "In this quote from James Baldwin, how does the statement serve as a direct characterization of the state of the world?", quote: "\"In this world, there isn't as much humanity as one would like. But, there is enough.\"", answers: ["The speaker makes a clear, measured assessment of humanity, acknowledging its flaws while affirming its ultimate sufficiency.", "It directly characterizes the world as a terrible place with not enough humanity.", "It directly characterizes the speaker's own humanity.", "It directly characterizes the world as being perfect just the way it is."], correctAnswer: "The speaker makes a clear, measured assessment of humanity, acknowledging its flaws while affirming its ultimate sufficiency.", explanation: "The speaker is making a direct, explicit judgment about the state of humanity in the world. They are not using metaphor or indirect language but are plainly stating their assessment: it's flawed, but sufficient. This is a direct characterization of a concept.", additionalExample: "A history book might begin with the direct characterization, 'The 19th century was an age of great contradiction,' explicitly stating the nature of the era." },
            { question: "In A Connecticut Yankee in King Arthur's Court by Mark Twain, how does the speaker's speech indirectly characterize them?", quote: "\"Training-training is everything... We have no thoughts of our own, no opinions of our own; they are transmitted to us, trained into us.\"", answers: ["Their dogmatic speech characterizes them as a determinist who believes free will is an illusion.", "The speech characterizes the speaker as an effective teacher or trainer.", "It characterizes the speaker as someone who is not very intelligent and cannot form their own opinions.", "The speaker is characterized as a revolutionary who is trying to change the way people think."], correctAnswer: "Their dogmatic speech characterizes them as a determinist who believes free will is an illusion.", explanation: "The speaker's absolute and sweeping statements ('training is everything,' 'we have no thoughts of our own') reveal their philosophical viewpoint. This dogmatic way of speaking characterizes them as a determinist—someone who believes that people are shaped entirely by their environment and upbringing, with little room for free will.", additionalExample: "A character who constantly says 'Everything happens for a reason' is indirectly characterized as a fatalist or someone with a strong belief in destiny." },
            { question: "In Don Quixote by Miguel de Cervantes Saavedra, how is the idea of Don Quixote's brain drying up an example of hyperbole?", quote: "\"Finally, from so little sleeping and so much reading, his brain dried up and he went completely out of his mind.\"", answers: ["It is an exaggeration used to comically and vividly describe the cause of his madness.", "It is a literal medical diagnosis of Don Quixote's condition.", "It is a metaphor for Don Quixote's loss of creativity.", "It is an understatement designed to minimize the severity of his condition."], correctAnswer: "It is an exaggeration used to comically and vividly describe the cause of his madness.", explanation: "Hyperbole is exaggeration for effect. A person's brain cannot literally 'dry up' from reading. This is a comical exaggeration used to emphasize the extreme degree to which Don Quixote's reading obsession has affected his sanity.", additionalExample: "Saying 'This bag weighs a ton' is a hyperbole to express that the bag is very heavy." },
            { question: "In J.R.R. Tolkien's The Return of the King, how does this scene function in the overall plot?", quote: "\"In rode the Lord of the Nazgül... There waiting... sat Gandalf... Rohan had come at last.\"", answers: ["It is a critical moment representing the lowest point of the siege just before the tide turns, building immense tension.", "It is the final resolution of the entire story.", "It is the exposition that introduces the main characters of the battle.", "It is a flashback to a previous battle."], correctAnswer: "It is a critical moment representing the lowest point of the siege just before the tide turns, building immense tension.", explanation: "This moment in the plot represents the darkest hour just before the dawn. The greatest evil (the Lord of the Nazgûl) has breached the final defense, confronting the greatest good (Gandalf). The simultaneous arrival of Rohan marks this as the critical turning point where the tide of the battle is about to shift dramatically.", additionalExample: "In a sports movie, the moment where the team is losing badly in the final minutes, right before they launch their game-winning comeback, functions as this type of critical, low-point scene." },
            { question: "In The Little Prince by Antoine de Saint-Exupéry, what do the laughing stars become a symbol of?", quote: "\"You-You alone will have stars as no one else has them... In one of them I shall be laughing. And so it will be as if all the stars will be laughing...\"", answers: ["They become a symbol of the Prince's unique and enduring friendship, representing a secret, joyous connection.", "They symbolize the Prince's sadness at leaving his friend behind.", "They are a symbol of the narrator's loneliness.", "They symbolize the vastness and mystery of the universe."], correctAnswer: "They become a symbol of the Prince's unique and enduring friendship, representing a secret, joyous connection.", explanation: "The stars, which are ordinary to everyone else, are transformed into a unique symbol for the narrator. Because he will imagine the Prince's laugh in them, they become a personal and enduring symbol of their special, secret friendship that no one else can understand.", additionalExample: "A locket containing a photograph is not just a piece of jewelry; it is a symbol of the love and memory associated with the person in the picture." },
            { question: "In Stephen King's The Dark Tower, how does Susannah's introspective thought serve as indirect characterization?", quote: "\"Laughter, Susannah would later reflect, is like a hurricane: once it reaches a certain point, it becomes self-feeding, self-supporting.\"", answers: ["It characterizes her as deeply analytical, capable of deconstructing even a primal emotion to understand its mechanics.", "It characterizes her as a meteorologist with a professional interest in hurricanes.", "The thought characterizes her as a very serious person who does not laugh often.", "It characterizes her as someone who is frightened by powerful emotions like laughter."], correctAnswer: "It characterizes her as deeply analytical, capable of deconstructing even a primal emotion to understand its mechanics.", explanation: "Her internal thought process reveals her character. The fact that she would analyze something as natural as laughter in such a detailed, almost scientific way ('self-feeding, self-supporting') characterizes her as a highly intelligent and analytical person.", additionalExample: "A character who, upon seeing a sunset, starts thinking about the physics of light refraction is indirectly characterized as being analytical and perhaps less romantic." },
            { question: "In The Dark Tower by Stephen King, how does the narrator's speech in this quote serve as indirect characterization?", quote: "\"And will I tell you that these three lived happily ever after? I will not, for no one ever does. But there was happiness. And they did live.\"", answers: ["It characterizes the narrator as a realist who values truth over comforting clichés.", "It characterizes the narrator as a pessimist who does not believe in happiness.", "The quote characterizes the narrator as an unreliable storyteller.", "It characterizes the narrator as someone who does not know how the story ends."], correctAnswer: "It characterizes the narrator as a realist who values truth over comforting clichés.", explanation: "The narrator's choice of words characterizes their personality. By refusing the traditional 'happily ever after' ending, the narrator characterizes themselves as a realist who won't lie to the reader with a comforting fairy tale, preferring a more honest and nuanced conclusion.", additionalExample: "A narrator who frequently uses sarcasm and jokes is indirectly characterized as having a witty and perhaps cynical personality." },
            { question: "In Frank Herbert's Dune, how does the Litany Against Fear relate to internal conflict?", quote: "\"Fear is the mind-killer... I will face my fear. I will permit it to pass over me and through me... Where the fear has gone there will be nothing. Only I will remain.\"", answers: ["The litany is a tool for confronting and mastering the internal conflict between a person's will and their own fear.", "It relates to the external conflict between the speaker and their enemies.", "It shows that the speaker has no internal conflicts and is never afraid.", "It describes a conflict between the mind and the body."], correctAnswer: "The litany is a tool for confronting and mastering the internal conflict between a person's will and their own fear.", explanation: "The litany is a direct response to the internal conflict of feeling fear. It is a mental process for acknowledging the fear ('I will face my fear'), allowing it to happen ('permit it to pass'), and ultimately overcoming it, thus resolving the internal struggle and reasserting control.", additionalExample: "Someone taking deep breaths and counting to ten before giving a speech is using a tool to manage the internal conflict between their desire to speak and their stage fright." },
            { question: "In Richard Stark's Firebreak, how does the opening line immediately establish the plot?", quote: "\"When the phone rang, Parker was in the garage, killing a man.\"", answers: ["It is a stark opening that thrusts the reader directly into a moment of extreme action without any preamble.", "It establishes the plot by introducing the mystery of who was on the phone.", "It serves as the resolution, showing the final outcome of the story's conflict.", "It is part of the exposition, providing background on Parker's profession."], correctAnswer: "It is a stark opening that thrusts the reader directly into a moment of extreme action without any preamble.", explanation: "This opening line begins *in media res* (in the middle of the action). It doesn't set up the story with background information but immediately plunges the reader into a high-stakes situation, establishing the violent and criminal nature of the plot from the very first sentence.", additionalExample: "The opening of *Star Wars* establishes the plot immediately by showing a massive starship attacking a smaller one, thrusting the viewer straight into a galactic conflict." }
        ];
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // DOM Elements
            const screens = { 
                start: document.getElementById('start-screen'), 
                game: document.getElementById('game-screen'), 
                highscore: document.getElementById('highscore-screen'),
                gameOver: document.getElementById('game-over-screen')
            };
            const feedbackModal = document.getElementById('feedback-modal');
            const feedbackTitle = document.getElementById('feedback-title');
            const aiPrompt = document.getElementById('ai-prompt');
            const aiResponseArea = document.getElementById('ai-response-area');
            const explainBtn = document.getElementById('explain-btn');
            const exampleBtn = document.getElementById('example-btn');
            const explanationContainer = document.getElementById('explanation-container');
            const exampleContainer = document.getElementById('example-container');
            const feedbackExplanation = document.getElementById('feedback-explanation');
            const feedbackExample = document.getElementById('feedback-example');
            const proceedBtn = document.getElementById('proceed-btn');
            const playerInitialsInput = document.getElementById('player-initials');
            const startGameBtn = document.getElementById('start-game-btn');
            const continueGameBtn = document.getElementById('continue-game-btn');
            const viewScoresBtn = document.getElementById('view-scores-btn');
            const mainMenuBtnScores = document.getElementById('main-menu-btn-scores');
            const scoreDisplay = document.getElementById('score');
            const streakDisplay = document.getElementById('streak');
            const questionText = document.getElementById('question-text');
            const answersContainer = document.getElementById('answers-container');
            const questionCounter = document.getElementById('question-counter');
            const skipBtn = document.getElementById('skip-btn');
            const pauseGameBtn = document.getElementById('pause-game-btn');
            const endGameBtn = document.getElementById('end-game-btn');
            const highscoreList = document.getElementById('highscore-list');
            const fanfareContainer = document.getElementById('fanfare-container');
            const viewFinalScoresBtn = document.getElementById('view-final-scores-btn');

            let gameState = { playerName: 'AAA', score: 0, streak: 0, questionBank: [], currentQuestionIndex: 0 };
            let music = {}, sounds = {}, isAudioReady = false;
            let questionStartTime = 0; // Added for speed bonus

            // NEW AUDIO ENGINE
            async function initAudio() {
                if (isAudioReady) return;
                await Tone.start();

                const reverb = new Tone.Reverb(1.5).toDestination();
                reverb.wet.value = 0.15;

                const pluckySynth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "triangle" },
                    envelope: { attack: 0.01, decay: 0.2, sustain: 0.1, release: 0.5 }
                }).connect(reverb);
                pluckySynth.volume.value = -4;

                const bassSynth = new Tone.MonoSynth({
                    oscillator: { type: "square" },
                    envelope: { attack: 0.01, decay: 0.2, sustain: 0, release: 0.1 }
                }).toDestination();
                bassSynth.volume.value = -8;
                
                sounds = {
                    start: new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.01, decay: 0.4, sustain: 0, release: 0.1 } }).toDestination(),
                    incorrect: new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.01, decay: 0.3, sustain: 0, release: 0.1 } }).toDestination(),
                    correctFanfare: new Tone.PolySynth(Tone.Synth, { oscillator: { type: "square" }, envelope: { attack: 0.01, decay: 0.2, sustain: 0, release: 0.2 } }).toDestination(),
                    ai: new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.01, decay: 0.1, sustain: 0, release: 0.1 } }).toDestination()
                };
                
                music = {
                    start: new Tone.Sequence((time, note) => { 
                        pluckySynth.triggerAttackRelease(note, "8n", time); 
                    }, ["C4", "E4", "G4", "C5", "G4", "E4"], "8n").start(0),
                    
                    game: new Tone.Sequence((time, note) => { 
                        pluckySynth.triggerAttackRelease(note, "16n", time); 
                        if(note === "C4" || note === "F4" || note === "G4") bassSynth.triggerAttackRelease(note, "8n", time);
                    }, ["C4", "E4", "G4", "E4", "F4", "A4", "C5", "A4", "G4", "B4", "D5", "B4", "C4", "E4", "G4", "E4"], "8n").start(0),
                    
                    highscore: new Tone.Sequence((time, note) => { 
                        pluckySynth.triggerAttackRelease(note, "8n", time); 
                    }, ["E5", "C5", "G4", "C5"], "8n").start(0)
                };
                
                Tone.Transport.bpm.value = 132; // Peppy tempo
                Tone.Transport.start(); isAudioReady = true; playMusicForScreen('start');
            }

            const playSound = (sound, note, duration) => { if (!isAudioReady) return; sound.triggerAttackRelease(note, duration); };
            const playFanfare = () => { if (!isAudioReady) return; const now = Tone.now(); sounds.correctFanfare.triggerAttackRelease(["C5", "E5", "G5"], "8n", now); sounds.correctFanfare.triggerAttackRelease("C6", "8n", now + 0.2); };
            const playMusicForScreen = (screenId) => { if (!isAudioReady) return; Object.values(music).forEach(m => m.mute = true); if (music[screenId]) { music[screenId].mute = false; } };

            const showScreen = (screenId) => { Object.values(screens).forEach(screen => screen.classList.add('hidden')); screens[screenId].classList.remove('hidden'); playMusicForScreen(screenId); };
            const shuffleArray = (array) => { for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; } };
            
            // NEW UI LOGIC
            const updateUI = () => {
